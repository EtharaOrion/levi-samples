    <ellipse cx="880" cy="590" rx="30" ry="5" fill="#fff0b0"/>
    <text x="880" y="676" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#e9dcc0">CRUCIBLE</text>
  </g>

