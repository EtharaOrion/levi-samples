<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LEVI: The Cartographer of Long Roads</title>
  <desc id="hero-desc">A cartographer goddess holds a lantern over a night map. A road winds from the foreground to the horizon past three attendants: an archivist with an open ledger, a smith at an anvil, and a bearer carrying a molten crucible.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#172449"/>
      <stop offset="0.85" stop-color="#3b3552"/>
      <stop offset="1" stop-color="#6b4f52"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4774"/>
      <stop offset="1" stop-color="#232c4f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88a55"/>
      <stop offset="0.5" stop-color="#7a5e36"/>
      <stop offset="1" stop-color="#2c1f12"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="300">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.5" stop-color="#e3b35a"/>
      <stop offset="1" stop-color="#a8741f"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#5b70a6"/>
      <stop offset="0.4" stop-color="#28335e"/>
      <stop offset="1" stop-color="#0e1330"/>
    </linearGradient>
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e6c4"/>
      <stop offset="0.6" stop-color="#b59a68"/>
      <stop offset="1" stop-color="#5d4a2e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c9a2"/>
      <stop offset="1" stop-color="#b98663"/>
    </linearGradient>
    <linearGradient id="teal-robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f7a86"/>
      <stop offset="1" stop-color="#142a33"/>
    </linearGradient>
    <linearGradient id="ember-robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4632"/>
      <stop offset="1" stop-color="#2a1610"/>
    </linearGradient>
    <linearGradient id="plum-robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a4a78"/>
      <stop offset="1" stop-color="#22162c"/>
    </linearGradient>
    <radialGradient id="lantern-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="0.9"/>
      <stop offset="0.2" stop-color="#ffd27a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#f2a93b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b25a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2b25a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8fff4" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#3fc7b4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3fc7b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a0" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff7a2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="molten" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#ff8a30"/>
      <stop offset="1" stop-color="#7a1e0a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#03050c" stop-opacity="0"/>
      <stop offset="1" stop-color="#03050c" stop-opacity="0.7"/>
    </radialGradient>
    <path id="star4" d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z"/>
