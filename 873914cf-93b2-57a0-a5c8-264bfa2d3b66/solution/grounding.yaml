  "milestone": "batch-2026-09-22-twenty",
  "objective": "When a Pynecone application is started in production mode, the framework spins up the backend server using a process manager suited for serving many concurrent requests. On Linux and other Unix-like systems this works as expected, but on Windows the production launch fails outright because the chosen server cannot run on that platform. The observable defect is that a Windows user who tries to run their app in production mode gets a broken or non-starting backend, while the same command succeeds elsewhere. The required behaviour is that production mode must launch a working backend server on Windows, so that the production start command behaves usefully on every supported operating system.\n\nTo achieve this, the production launch must detect the platform it is running on and pick a backend server that is actually available there. On Windows it must fall back to a server that runs natively on that system, supplying it the correct host, port, application entry point, worker count, and log level arguments so that the app is served the same way a user expects. On non-Windows platforms the existing production server and its argument style must continue to be used exactly as before, since switching everyone to the alternate server is not a desirable trade. The log level and worker count configuration must continue to be honored in both cases.\n\nThe port-cleanup behaviour that runs before starting the server should also become more tolerant. When the framework attempts to free a port that is already in use, it must not crash if the operating system refuses permission to terminate the process holding that port; instead it should proceed gracefully. This matters most on Windows, where such permission errors are more common, but the tolerant behaviour is correct on any platform.\n\nThis is not a breaking change for application authors. Apps that already run in production mode on Unix-like systems must continue to start and serve identically, with no change to their configuration, their entry point, or the arguments passed to the server. Only the Windows path, which previously did not work, gains new working behaviour, and the port-cleanup path gains resilience against permission errors.\n\nBecause parts of the frontend and app scaffolding are produced from templates rather than written by hand, any generated output that changes as a result of this work must be regenerated so that a freshly initialized or freshly built app reflects the updated behaviour rather than stale generated content. Everything else about how apps compile, render, and run must keep working exactly as it does today.",
  "ordered_plan": "1. Add a constant to pynecone/constants.py naming the Windows-capable backend server command, alongside the existing Unix production server constant.\n2. In pynecone/utils.py, import or confirm access to the platform module and branch run_backend_prod on platform.system() == 'Windows'.\n3. On the Windows branch, build the command using the new constant with host, port, the module:app entry point, and the server's native argument style; on the non-Windows branch keep the exact prior Unix invocation including bind, threads, and the factory-style entry point.\n4. Append the shared log level and worker count arguments after the branch so both servers receive them in a correct form, preserving the original values.\n5. Wrap the kill() call in kill_process_on_port with contextlib.suppress against the process library's permission-denied exception, and ensure contextlib and the process library are imported.\n6. Regenerate any template and manifest output under .templates and any lock or generated files that the broader change alters, so freshly built apps are consistent.\n7. Run the eight target tests to confirm they pass and the platform branching and cleanup tolerance behave as expected.\n8. Run the full preserved suite to confirm the Unix command line and all other behaviour remain byte-for-byte unchanged.",
