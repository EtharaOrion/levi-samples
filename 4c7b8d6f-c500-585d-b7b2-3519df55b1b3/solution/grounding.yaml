  "milestone": "batch-2026-09-15-a",
  "objective": "The .NET tooling in mise currently only knows how to install .NET SDKs. A user who wants a specific .NET runtime installed, either alongside an SDK or on its own, has no way to express that intent. The required behaviour is to let users request a runtime-only installation through an inline tool option named `runtime`, which selects which .NET framework to install rather than a full SDK. This option must be accepted both from the command line using the existing side bracket syntax on the tool name and from the tools table of a mise configuration file, where a version entry may carry the option as an additional key.\n\nThe `runtime` option must accept only the recognized .NET framework names, which are `dotnet`, `aspnetcore`, and `windowsdesktop`. Any other value must be rejected with a clear validation error rather than being passed through to the underlying install machinery. When a valid runtime value is present, the installation must instruct the .NET install process to fetch that runtime for the requested version instead of an SDK, honoring the platform-appropriate invocation on both Unix-like systems and Windows.\n\nBecause a runtime-only installation does not provide the SDK command surface, the post-install sanity check that confirms an SDK by invoking the .NET version command must not run for runtime installs, since it would otherwise fail on a perfectly good runtime. The installed files for a runtime live under a different directory layout than SDKs do, organized by framework and version rather than under the SDK path, and uninstalling a runtime must remove the correct runtime location for the chosen framework and version rather than attempting to remove an SDK that was never installed.\n\nThere is a related defect in uninstall handling that must be fixed for this to work end to end. When a tool is requested for uninstallation, the requested versions are gathered from more than one source, and duplicates are collapsed so that a version is only acted on once. Today the entry that carries the tool options can be discarded during that deduplication in favor of a plain filesystem match, which means the options a user specified never reach the uninstall logic. After the change, the entry that carries the resolved tool options must be the one that survives deduplication, so that a runtime uninstall targets the right path. This must not disturb the uninstall behaviour for ordinary tools and versions that carry no options.\n\nThis is an additive feature and not a breaking change. Installing and uninstalling .NET SDKs with no `runtime` option must continue to behave exactly as it does now, and all behaviour of other tools and backends must be unaffected. The user-facing documentation for the .NET language support should describe the new runtime-only capability, the set of valid values, and how to request it from both the command line and configuration files.\n\nIf the project ships generated artifacts such as shell completions or a configuration schema that are derived from the tool and option definitions, and the new option affects any of them, those generated outputs must be regenerated so they remain consistent with the source of truth.",
  "ordered_plan": [
    "Locate the .NET backend and the request-option plumbing, and identify where ToolVersion options are read so a `runtime` key can be extracted from both the side bracket and tools-table forms.",
    "Add validation that accepts only `dotnet`, `aspnetcore`, and `windowsdesktop` and returns a clear error for any other value, wired in early so invalid values never reach the install script.",
    "Branch the install routine so that a valid runtime uses the platform-appropriate dotnet-install runtime selector for the given framework and version on both Unix and Windows, leaving the SDK path unchanged when no runtime is set.",
    "Skip the post-install SDK version-command sanity check when a runtime install was performed, keeping it intact for SDK installs.",
    "Compute the framework-and-version runtime directory layout for installed-file listing and for uninstall when a runtime was requested, and keep the SDK layout otherwise.",
    "Fix the uninstall version deduplication so the option-bearing ToolVersion survives collapse instead of a bare filesystem match, without altering the resulting version set for optionless tools.",
    "Update the .NET language documentation to describe runtime-only installs, the valid values, and both the command-line and config-file request forms.",
    "Regenerate any derived artifacts such as shell completions and the JSON schema so they reflect the new option.",
    "Run the five target tests and the full preserved suite to confirm the feature works and nothing regresses."
  ],
