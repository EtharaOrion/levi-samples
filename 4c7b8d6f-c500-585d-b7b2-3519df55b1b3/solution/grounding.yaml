  "truth_sections": {
    "defect": "The .NET backend in mise can only install full SDKs; there is no way for a user to request a runtime-only install of a specific .NET framework. There is no inline `runtime` tool option accepted from either the command-line side bracket syntax or the tools table of a config file, no validation restricting values to the recognized framework names, no plumbing to make the install fetch a runtime instead of an SDK, and no correct uninstall path for runtime layouts. Additionally, the SDK sanity check runs unconditionally after install, which would fail on a valid runtime, and the uninstall deduplication logic discards the entry carrying tool options in favor of a plain filesystem match, so options never reach the uninstall logic.",
    "ordered_plan": "1. Locate the .NET backend and the request-option plumbing, and identify where ToolVersion options are read so a `runtime` key can be extracted from both the side bracket and tools-table forms.\n2. Add validation that accepts only `dotnet`, `aspnetcore`, and `windowsdesktop` and returns a clear error for any other value, wired in early so invalid values never reach the install script.\n3. Branch the install routine so that a valid runtime uses the platform-appropriate dotnet-install runtime selector for the given framework and version on both Unix and Windows, leaving the SDK path unchanged when no runtime is set.\n4. Skip the post-install SDK version-command sanity check when a runtime install was performed, keeping it intact for SDK installs.\n5. Compute the framework-and-version runtime directory layout for installed-file listing and for uninstall when a runtime was requested, and keep the SDK layout otherwise.\n6. Fix the uninstall version deduplication so the option-bearing ToolVersion survives collapse instead of a bare filesystem match, without altering the resulting version set for optionless tools.\n7. Update the .NET language documentation to describe runtime-only installs, the valid values, and both the command-line and config-file request forms.\n8. Regenerate any derived artifacts such as shell completions and the JSON schema so they reflect the new option.\n9. Run the five target tests and the full preserved suite to confirm the feature works and nothing regresses.",
    "pitfalls": "- Reading the `runtime` option from only one request surface (for example the command line but not the tools table) so config-file requests silently fall back to an SDK install.\n- Forgetting to skip the SDK version-command sanity check for runtime installs, causing a valid runtime install to be reported as failed.\n- Computing the uninstall path using the SDK layout, so a runtime uninstall removes nothing or errors while the runtime files remain on disk.\n- Fixing the dedup so aggressively that ordinary optionless duplicates stop collapsing, or changing the resulting version set instead of merely preferring the option-bearing entry.\n- Passing an unvalidated runtime string through to the install script, so an unknown framework value fails deep in the tooling instead of with a clear early validation error.\n- Neglecting to regenerate completions and the JSON schema, leaving generated artifacts inconsistent with the new option and breaking any test that checks them.",
    "root_cause": "The .NET language backend was written with the single assumption that a version string maps to an SDK. The install routine builds the dotnet-install invocation (the shell script on Unix, the PowerShell script on Windows) with SDK-oriented flags only, and the post-install verification always shells out to the .NET version command to confirm an SDK is present. There is no branch that inspects a tool option to decide between SDK and runtime, so even if a `runtime` value were present it would be ignored and the SDK path would be taken. The directory layout the backend computes for installed files and for uninstall is the SDK layout, so it has no notion of the framework-and-version runtime layout that the install script actually produces for `--runtime` installs.\n\nThe option surface itself is missing. Inline tool options arrive through the side bracket syntax on a tool name on the command line and through additional keys on a version entry in the tools table of a mise config. These options flow into the ToolVersion request options, but nothing in the .NET backend reads a `runtime` key from them, and nothing validates it. Without a validation gate, an arbitrary string would either be silently ignored or passed through to the install machinery, neither of which is the required behaviour of rejecting unknown values with a clear error while accepting only `dotnet`, `aspnetcore`, and `windowsdesktop`.\n\nThe uninstall deduplication defect is a separate but blocking mechanism. When a tool is scheduled for uninstall, the set of versions to remove is assembled from more than one source: the versions resolved from the request (which carry the parsed tool options) and versions discovered directly on the filesystem (which do not). The dedup step collapses equal versions but, as written, keeps whichever entry it encounters first, and that can be the bare filesystem match. When the filesystem match wins, the ToolVersion that reaches the uninstall logic has empty options, so the backend cannot know it should target a runtime path. This means that even a correct install and correct uninstall-path computation would still fail end to end, because the `runtime` option is lost before the backend is consulted.",
    "solution_shape": "A correct change threads a validated `runtime` option from the request surfaces into the .NET backend and uses it to select runtime versus SDK behaviour at install, verification, and uninstall time. The option must be readable from ToolVersion request options regardless of whether it originated from the command-line side bracket syntax or from a tools-table key, since both paths already converge on the same options map. Validation must happen early enough that an unrecognized value produces a clear error and never reaches the install script; only `dotnet`, `aspnetcore`, and `windowsdesktop` are accepted.\n\nAt install time, when a valid runtime is present, the backend must invoke the platform-appropriate dotnet-install script with the runtime selector for the requested framework and version rather than the SDK selector, on both Unix-like systems and Windows. The post-install SDK sanity check must be skipped for runtime installs, because invoking the .NET version command on a runtime-only tree would fail even though the install succeeded. The path computation used for listing installed files and for uninstall must produce the framework-and-version runtime layout when a runtime was installed, and the plain SDK layout otherwise, so uninstall removes exactly what install created.\n\nThe uninstall dedup fix must ensure the entry carrying resolved tool options survives collapse rather than a bare filesystem entry. The shape here is to prefer the option-bearing ToolVersion when two entries compare equal by version, so the backend receives the runtime option. This must be a targeted preference that does not change the resulting version set or the behaviour for ordinary optionless tools; deduplication of plain versions must still collapse to a single action.\n\nBecause the feature is additive, every path with no `runtime` option must behave exactly as before: SDK install, SDK verification, SDK layout, and SDK uninstall are unchanged, and no other backend is touched. Any generated artifacts that derive from the tool and option definitions, such as shell completions or the JSON schema, must be regenerated so they stay consistent, and the .NET language documentation must describe the new capability, the valid values, and both request forms. An alternative implementation that reaches the same observable behaviour, for example a different internal representation of the runtime selection, is equally acceptable."
  },
