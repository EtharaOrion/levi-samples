[project]
name = "crucible"
version = "0.1.0"
description = "CRUCIBLE audit harness for the levi-samples verification root"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
crucible = "crucible:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "crucible.py",
    "core.py",
    "normalize.py",
    "recon.py",
    "registry.py",
    "evidence.py",
    "scanners.py",
    "leakgate.py",
    "provenance.py",
    "delivery.py",
    "verifier.py",
    "rubric.py",
    "contamination.py",
    "reward.py",
    "adversary.py",
    "fidelity.py",
    "reference.py",
    "calibration.py",
    "lineage.py",
    "attestation.py",
    "ledger.py",
    "selfcheck.py",
    "verify.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
