schema: crucible.scanner-config/v1
name: hadolint
category: container-lint
tool:
  runner: none
  spec: hadolint
  version_pinned: false
  version_pin_note: >-
    hadolint ships as a Haskell binary and is absent from this host. The uv
    toolchain the harness is confined to cannot resolve it.
database:
  kind: lint-rules
  pin_state: pinned
  pin_basis: >-
    hadolint carries its rule set inside the binary rather than fetching it, and
    the local configuration committed at
    .audit/scanner-configs/rules/hadolint.yaml selects which of those rules apply.
    The selection is pinned by content digest.
  sources:
    - path: .audit/scanner-configs/rules/hadolint.yaml
runs: false
runs_basis: >-
  The rule set is pinned but the binary is absent from this host, so the
  instrument does not run. It emits a D-COVERAGE-GAP capping HOLD through the
  registry field disposition_cap_on_absence. An absent binary is an availability
  gap, distinct from the unpinned database BLOCK.
argv_template:
  - hadolint
  - --config
  - .audit/scanner-configs/rules/hadolint.yaml
  - --format
  - json
  - --no-fail
timeout_seconds: 300
coverage_gap_id: D-SCANNER-HADOLINT-ABSENT
evidence_note: >-
  Each bundle commits two Dockerfiles, one under environment/ and one under
  tests/. Dockerfile configuration therefore has substrate here even though no
  instrument can read it.
