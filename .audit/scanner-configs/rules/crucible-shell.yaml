rules:
  - id: crucible-shell-curl-pipe-shell
    languages: [bash]
    severity: ERROR
    message: >-
      Fetching a script and piping it straight into a shell executes whatever the
      endpoint serves at that moment, with no digest and no opportunity to read
      the bytes first.
    pattern-either:
      - pattern: curl ... | sh
      - pattern: curl ... | bash
      - pattern: wget ... | sh
      - pattern: wget ... | bash

  - id: crucible-shell-curl-insecure
    languages: [bash]
    severity: ERROR
    message: >-
      curl -k or --insecure disables certificate validation, so the transport no
      longer authenticates the peer.
    pattern-either:
      - pattern: curl -k ...
      - pattern: curl --insecure ...

  - id: crucible-shell-rm-rf-root
    languages: [bash]
    severity: ERROR
    message: >-
      An unguarded recursive force removal rooted at a filesystem root or at an
      unquoted variable deletes whatever that expression happens to expand to.
    pattern-either:
      - pattern: rm -rf /
      - pattern: rm -rf /*
      - pattern: rm -fr /
      - pattern: rm -rf $$VAR/

  - id: crucible-shell-missing-errexit
    languages: [bash]
    severity: INFO
    message: >-
      A script without set -e continues past a failed command, so a later step can
      report success over a broken earlier one.
    patterns:
      - pattern-regex: ^#!/(usr/)?bin/(env )?(ba)?sh
      - pattern-not-regex: set -[a-z]*e

  - id: crucible-shell-eval
    languages: [bash]
    severity: WARNING
    message: >-
      eval re-parses its argument as shell syntax, so any interpolated value
      becomes code.
    pattern: eval $$X

  - id: crucible-shell-apt-no-pin
    languages: [bash]
    severity: WARNING
    message: >-
      An unversioned package install resolves to whatever the archive holds at
      build time, which makes the resulting image unreproducible.
    pattern-either:
      - pattern: apt-get install -y $$PKG
      - pattern: apt install -y $$PKG

  - id: crucible-shell-pip-no-pin
    languages: [bash]
    severity: WARNING
    message: >-
      An unpinned pip install resolves to whatever the index holds at build time,
      which makes the resulting environment unreproducible.
    pattern-regex: pip3? install (?!.*[=<>])(?!.*-r )[A-Za-z0-9_.-]+
