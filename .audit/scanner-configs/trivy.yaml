schema: crucible.scanner-config/v1
name: trivy
category: container-vulnerability
tool:
  runner: none
  spec: trivy
  version_pinned: false
  version_pin_note: >-
    trivy ships as a Go binary and is absent from this host. The uv toolchain the
    harness is confined to cannot resolve it.
database:
  kind: vulnerability-feed
  pin_state: unpinned-offline
  pin_basis: >-
    The trivy database is pulled as an OCI artifact and refreshed on a schedule.
    Pinning it would require committing that artifact at a fixed digest, which this
    project does not hold. A result obtained against an unpinned feed is
    unreproducible.
  sources: []
runs: false
runs_basis: >-
  The database cannot be pinned and the binary is absent, so this instrument does
  not run. It emits a D-COVERAGE-GAP capping HOLD through the registry field
  disposition_cap_on_absence, and is never cited as evidence.
argv_template:
  - trivy
  - filesystem
  - --format
  - json
  - --scanners
  - vuln,secret,misconfig
  - --exit-code
  - "0"
  - .
timeout_seconds: 1200
coverage_gap_id: D-SCANNER-TRIVY-UNPINNED
evidence_note: >-
  trivy overlaps grype on vulnerability coverage and hadolint on Dockerfile
  configuration. All three are absent, so the container surface carries no live
  scanner and the gap is recorded once per instrument rather than folded together.
