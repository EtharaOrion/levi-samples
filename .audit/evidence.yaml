    reconciled against the declared one.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-FREEZE-UNDERIVABLE
  instrument: G-CON-FREEZE
  reason: no-admissible-generating-event-timestamp
  statement: Step 8i requires the task-generating-event timestamp, meaning issue creation or the bug-introducing
    change, and refuses a rewritable commit timestamp as a substitute. Every named bundle records that
    timestamp as null with state unresolved, so the freeze comparison is underivable. The commit timestamps
    are recorded in the notes as inadmissible context, and at least one of them precedes a listed cutoff.
  subject: 4c7b8d6f-c500-585d-b7b2-3519df55b1b3,6bf0c918-e9ad-5397-bb76-cf3e238f2df1,873914cf-93b2-57a0-a5c8-264bfa2d3b66
