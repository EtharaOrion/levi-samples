- caps: HOLD
  gap_id: D-CAL-PILOT-AGGREGATE-UNPROJECTED
  instrument: G-CAL-MONOTONICITY
  reason: signed-pilot-pass-rate-aggregate-unprojected
  statement: 'No signed pilot pass-rate aggregate is projected for any resident bundle. Every calibration
    row the permitted projection channel carries is keyed to a non-resident instance and records signed_cohort_pass_rates
    as null, so the signed half of the ordering input does not exist for this corpus. The rewards committed
    beside the rollouts are unsigned producer-written numbers at one run per solver identity and are not
    an aggregate. No hardness source was consulted to fill this void: the ordering input is recorded as
    absent rather than reconstructed from a forbidden surface.'
  subject: project
  surface: calibration
- caps: HOLD
  gap_id: D-CAL-TIER-UNPROJECTED
  instrument: G-CAL-MONOTONICITY
  reason: tier-declaration-unprojected
  statement: No tier declaration reaches this instrument through the permitted projection channel (CRUCIBLE_VIEW
    checker_metadata e21_calibration declared_tier). The projection carries tier declarations only for
    instances that are not resident in this tree. The manifests do carry their own tier target, and it
    is withheld by name rather than read, because a frontier-defeat target is inside the containment boundary
    CRUCIBLE may not cross and a finding citing it would be out of scope.
  subject: project
  surface: calibration
- caps: HOLD
  gap_id: D-CON-ATTESTATION-UNAVAILABLE
  instrument: G-CON-EXCLUSION
  reason: attestation-unavailable
  statement: Step 8k requires this atom to re-resolve a signed platform attestation against the source
    attestation trust root and reconcile the attested value against the declaration. That trust root is
    absent from the projection, and every carrier records attestation_state as attestation-unavailable,
    so the reconciliation did not run.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-EXCLUSION-ANCESTRY-UNRESOLVED
  instrument: G-CON-EXCLUSION
  reason: fork-ancestry-closure-unresolvable
  statement: The second exclusion relation requires membership of any ancestor in the full fork-ancestry
    closure rather than the direct parent alone. No committed byte at this root resolves that closure
    for the named bundles, so the relation was computed over the direct identity only and the ancestor
    arm remains underivable.
  subject: 4c7b8d6f-c500-585d-b7b2-3519df55b1b3,6bf0c918-e9ad-5397-bb76-cf3e238f2df1,873914cf-93b2-57a0-a5c8-264bfa2d3b66
