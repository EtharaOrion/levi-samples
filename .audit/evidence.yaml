  instrument: G-CON-EXCLUSION
  reason: pull-request-identity-unresolvable
  statement: The exclusion root states its relation as exact organization, repository, and pull-request
    identity. The named bundles sit in a repository the root already screened, but no committed byte carries
    the pull-request numbers their spans cover, so repository-level absence of a match is not the same
