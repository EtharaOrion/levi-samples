    statement: Step 8i requires CRUCIBLE to recompute the binding block independently using the same canary-normalized
      canonical bundle hash the leak gate recomputes, and to retain any divergence as a hash-bound critical
      floor breach. The projection carries no bound definition of that hash, and the only definition present
