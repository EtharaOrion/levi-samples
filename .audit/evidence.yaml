- caps: HOLD
  gap_id: D-CON-NEARDUP-CORPUS-OPAQUE
  instrument: G-CON-NEARDUP
  reason: corpus-publishes-digests-not-payloads
  statement: The pinned corpus root publishes each of its units as an identity, a payload digest, and
    a shingle count, and publishes no shingle set or payload text. Exact payload identity against that
    corpus is computable and was computed. The similarity score the bound threshold is defined against
    is not computable from those bytes, so the cross-corpus arm of this atom is unresolved and a clean
    exact-identity result never certifies absence of a near neighbour.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-NEARDUP-REVIEW-UNADJUDICATED-6bf0c918-873914cf
  instrument: G-CON-NEARDUP
  reason: review-band-unadjudicated
  statement: Step 8j opens a mandatory recorded semantic adjudication for a neighbour from the review
    threshold up to but excluding the near-duplicate threshold. No adjudication record exists for this
    pair, and a semantic adjudication may only lower a disposition and may never certify absence.
  subject: 6bf0c918-e9ad-5397-bb76-cf3e238f2df1,873914cf-93b2-57a0-a5c8-264bfa2d3b66
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-RECORD-BINDING-RECOMPUTE-UNPROJECTED
  instrument: G-CON-RECORD
  reason: canary-normalized-bundle-hash-algorithm-unprojected
  statement: Step 8i requires CRUCIBLE to recompute the binding block independently using the same canary-normalized
    canonical bundle hash the leak gate recomputes, and to retain any divergence as a hash-bound critical
    floor breach. The projection carries no bound definition of that hash, and the only definition present
    is the authoring generator inside the bundle, which step 8b forbids this harness from adopting as
    its own normalizer. The recomputation therefore did not run and the declared binding block is neither
    confirmed nor refuted.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-RECORD-EXTERNAL-PROOF-ABSENT
  instrument: G-CON-RECORD
  reason: external-signed-proof-absent
  statement: Step 8i requires the provenance atom result to reside in the external signed proof rather
    than in the carrier. No external signed proof is delivered at this root, so the atom result exists
    only as a carrier claim, and a carrier claim can lower a disposition but can never establish one.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-RECORD-REAUDIT-ENVELOPE-UNDELIVERABLE
  instrument: G-CON-RECORD
  reason: reaudit-proof-sink-not-writable
  statement: Step 8n requires each re-audit to be wrapped in a signed envelope delivered to the parent
    proof directory. That directory is outside this verification root and is not writable from here, and
    a prompt-only contract cannot schedule the external work, so the standing re-audit lane has no sink
    and no scheduler.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-SHIPPED-ROOT-UNRESOLVABLE
  instrument: G-CON-EXCLUSION
  reason: shipped-under-root-unresolvable
  statement: Step 8l requires recording the shipped-under root digest, the currently effective root digest,
    and whether they differ. Every resident carrier records its shipped-under exclusion root as unsupplied
    with no digest, so the differential re-screen has no shipped-under side to compare against.
  subject: project
  surface: task_corpus
- caps: HOLD
  gap_id: D-CON-STRIP-CLOSURE-IDENTITY-UNRESOLVED
  instrument: G-CON-STRIP
  reason: closure-identity-unresolvable
  statement: Closure identity requires the scanned manifest, configuration, history, and layer set to
    equal what the delivery block pinned and what the committed evidence executed under. No layer or configuration
    set resolves here, so the equality was never tested and the re-derived closure covers committed bundle
    bytes only.
  subject: project
  surface: containers
- caps: HOLD
  gap_id: D-CON-STRIP-HISTORY-UNIMPLEMENTED
  instrument: G-CON-STRIP
  reason: layer-set-unresolvable
  statement: History absence must reject git object databases, packfiles, refs, reflogs, shallow metadata,
    alternates, bundles, and worktrees in every unpacked layer including later-whiteouted content. No
    image layer set resolves at this root, and step 8i states that resolving only a merged filesystem
    does not satisfy this check because deleted objects remain recoverable from lower layers. The shortfall
    is recorded as unimplemented and never as a pass.
  subject: project
  surface: containers
- caps: HOLD
  gap_id: D-CON-STRIP-NETWORK-POLICY-UNRESOLVED
  instrument: G-CON-STRIP
  reason: runtime-network-policy-unobserved
  statement: Remote absence must also reject a runtime network policy permitting repository access, and
    must reject remotes and credential caches inside the built image. No committed byte records the enforced
    policy mode for the evaluated runs, and the only evidence that the image carries no remote is the
    build recipe asserting it, which is a producer claim about an artifact this run cannot resolve rather
    than an independent observation.
  subject: project
  surface: containers
