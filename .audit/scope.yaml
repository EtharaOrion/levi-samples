        instance_id: jdx__mise-span:6c24088
      - task_uuid_v5: 6bf0c918-e9ad-5397-bb76-cf3e238f2df1
        instance_id: reflex-dev__reflex-269334014d4d
      - task_uuid_v5: 873914cf-93b2-57a0-a5c8-264bfa2d3b66
        instance_id: reflex-dev__reflex-977cc6990f22
    evidence:
      - >-
        A grep of crucible_view.yaml for every resident task_uuid_v5 and every resident instance_id
        returns zero occurrences for each.
      - >-
        exclusion_list.json limitation one asserts that the root scopes to the three bundles the
        samples tree holds. That claim is false against the current tree.
      - >-
        source_attestation.json bundle_evidence cites paths of the form
        samples/56e866ec-41f7-428b-9c91-51b9787ce934/tests/config.json that do not exist in this
        checkout.
      - >-
        Each resident bundle's own solution/provenance.yaml independently confirms the gap from the
        producer side: all four screening_roots entries read state unsupplied with identity and
        digest unresolved, and the exclusion_matching, freeze_holdout and near_duplicate_screening
        atoms each read state unresolvable-root with a null result digest.
    consequence: >-
      For each resident bundle the producer-side and ENGRAM-side determinations for the exclusion,
      freeze and near-duplicate atoms are absent. This is the headline Phase 0 finding.
    critical_distinction: >-
      The absent thing is the PRODUCER determination, not the auditor's ability to derive one. Step
      8i is explicit that each instrument resolves ENGRAM-owned roots by identity and immutable
      digest and then derives its own result from committed bundle bytes before comparing claims, and
      that a carrier outcome or author pass assertion is never evidence. The roots themselves resolve:
      the exclusion-list root is pinned at digest 6ef5c83e and carries every row 7f names, and the
      near-duplicate corpus snapshot is pinned at digest 3f8669da over 1391 units with a measured
      floor and a pinned calibration. CRUCIBLE can therefore recompute canonical repository identity
      and base commit SHA against the resolved exclusion rows, and can recompute containment against
      the pinned corpus snapshot, from committed bundle bytes alone and without reaching across the
      firewall. G-CON-EXCLUSION and G-CON-NEARDUP consequently RUN in Phase 1 and are not inert. A
      required instrument whose every branch returns a coverage gap would be SAB_INERT_INSTRUMENT,
      and an atom unable to fire caps at BLOCK under step 8i, so declaring these two instruments
      unable to fire would be both wrong on the facts and self-escalating.
