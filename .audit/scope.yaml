project:
  root: ./
  root_kind: verification_root
  root_basis: >-
    This checkout registers trinity/ in its own .gitmodules and carries none of .seed/, samples/,
    delivery/, harness/ or staging/, so under invocation item 9 it is the parent project root for
    this run. Every rule applies unchanged, .audit/ and VERDICT.md live at this checkout root, and
    the run audits its own committed bytes alone.
  git_sha: bca6245cc29b5dd944d6e7ec8b1a3b45ce21ebfa
  branch: main
  remote: EtharaOrion/levi-samples
  history_depth: 17
  history_depth_basis: >-
    Seventeen commits is the entire history this checkout carries and not a window over a longer one.
    The first commit is the root commit of this repository. Whether an authoring history existed
    elsewhere before this tree was populated cannot be determined from committed bytes, so the
    full-history surface is the seventeen commits present and nothing is asserted about a prior
    lineage.
  dirty_bit: true
  dirty_detail: >-
    Three untracked paths stood at scope time and all three are gate machinery rather than audited
    surfaces: .audit/runs/crucible-ankitporwal04-20260923t005222z-dba1b1/gate-receipts/preflight-0010.json,
    .sentinel/ and .trinity/install/. The gate permits gate receipts, disposition records, install
    receipts and the sentinel ledger to stand uncommitted. No audited bundle byte is dirty.

direction_source:
  rung: parent
  basis: >-
    Rule 9a resolves in fixed order. This checkout's own .gitmodules registers no .memory, so rung
    one does not apply. The directory above registers this checkout as a gitlink at samples/ and
    registers .memory/ against its own remote, so rung two applies and the parent ENGRAM root is
    the direction source. The run never falls through to the direction-free rung once an earlier
    rung exists.
  view_path: ../.memory/crucible_view.yaml
  epoch: 1
  epoch_manifest_digest: 799db411215e85c9417ad7dcc76cbcb2c11e73de6792924a1ec248cfd06b3af5
  epoch_published_by: engram-v1ibh1vsingh-20260921t052007z-681be6
  epoch_verification: >-
    epochs.py check exits 0 non-vacuously against the published epoch, so the bound digest
    recomputes and the VERIFICATION_ROOT_UNPUBLISHED stop that halted the previous invocation is
    cleared. The epoch was published during this run by the parent-side ENGRAM proposal fold, not
    by this instrument, so no instrument authored its own direction.
  access_mode: read_only
  forbidden_surfaces_not_read:
    - ../.memory/hardness.yaml
    - ../.memory/ledger.yaml
    - ../.memory/forge_view.yaml
    - HARDNESS.md

vendored:
  - path: trinity/
    kind: gitlink
    pinned_sha: d3da6ad1dbaaf02fef204e67b64a0750b64de57a
    treatment: >-
      Recorded by pinned commit SHA as vendored source. Never descended as authored project code.
      The tree inventory, the full-history walk and the full-history secret scan all stop at this
      gitlink.
    freshness: HEAD equals fetched origin/main tip, checkout clean

harness:
  path: .audit/
  kind: plain_tracked_directory
  gitlink: null
  basis: >-
    Inside a verification root .audit/ is the plain directory this checkout tracks, never a
    submodule, and a submodule registered at that path would be the PARENT_LAYOUT_VERIFICATION_SUBMODULE
    hold. Every CRUCIBLE write for this run lands in this one repository, so the commit gate lists
    one repository and no parent gitlink update belongs to this instrument.
  own_harness_never_audited: true

ignore_policy:
  source: .gitignore
  entries:
    - .trinity/runtime/
    - .trinity/secrets/
  scan_exclusions:
    - trinity/
    - .audit/
  scan_exclusion_basis: >-
    trinity/ is vendored source behind a gitlink. .audit/ is this instrument's own harness and never
    an audited surface. Neither exclusion narrows the audited bundle bytes. The git object store is
    deliberately NOT excluded here: the full-history secret scan reads it directly, and excluding it
    in the scope ignore policy would silently starve that instrument. Any per-scanner path exclusion
    belongs in the instrument argv builder, never in this policy.

