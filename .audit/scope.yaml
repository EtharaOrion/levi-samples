deferred_register:
  path: DEFERRED.md
  state: absent
  consequence: >-
    Phase 0 step 7g reconciliation resolves against an empty register. No required instrument may
    cite a deferral row, so every required instrument lacking an implementation is recorded as a
    coverage gap rather than a deferral.

required_instruments:
  - id: PY-STATIC
    category: python_static_analysis
    mandated_by: python ecosystem present
    binary: semgrep
    availability: absent_on_host
    provisioning: uv-managed pin inside .audit
    config_policy: >-
      Rules pinned by digest inside .audit. Never semgrep --config auto, because auto resolves rules
      over the network at run time and makes the scan unreproducible.
  - id: PY-SECURITY
    category: python_security
    mandated_by: python ecosystem present
    binary: bandit
    availability: absent_on_host
    provisioning: uv-managed pin inside .audit
  - id: PY-LINT
    category: python_lint
    mandated_by: python ecosystem present
    binary: ruff
    availability: present_on_host
    note: >-
      Available at the system Python 3.14 prefix. Phase 1 pins its own version inside .audit rather
      than depending on the host binary.
  - id: DEP-VULN
    category: dependency_vulnerability
    mandated_by: python and rust ecosystems present
    binary: osv-scanner
    availability: absent_on_host
    provisioning: pinned OSV database snapshot inside .audit
    condition: >-
      No bundle-level lockfile is committed. Cargo.lock, poetry.lock, bun.lock, flake.lock and
      mise.lock appear only as paths inside solution/fix.patch diffs, so a tree scan has no manifest
      to read. The instrument must therefore resolve its input from the pinned image rather than the
      committed tree, and if it cannot, this becomes a coverage gap rather than a clean scan.
  - id: SECRET-SCAN-HISTORY
    category: secret_scanning
    mandated_by: full git history present at depth 17
    binary: trufflehog
    availability: absent_on_host
    provisioning: uv-managed or pinned binary inside .audit
    config_policy: >-
      Full history walk, not a working-tree scan. The walk stops at the trinity/ gitlink. Verified
      detectors only for escalation, with unverified findings retained separately.
  - id: CONTAINER-LINT
    category: container_static
    mandated_by: Dockerfiles present in every bundle
    binary: hadolint
    availability: absent_on_host
  - id: CONTAINER-VULN
    category: container_vulnerability
    mandated_by: containers present
    binary: grype
    availability: absent_on_host
    condition: >-
      Requires pulling the pinned registry digests from a private ECR namespace. If credentials are
      unavailable this instrument cannot fire and becomes a named coverage gap.
  - id: CONTAINER-SBOM
    category: container_composition
    mandated_by: containers present
    binary: syft
    availability: absent_on_host
    condition: same registry-access condition as CONTAINER-VULN
  - id: CONTAINER-PIN
    category: container_pin_verification
    mandated_by: containers present
    implementation: .audit local module
    availability: implementable_without_network
    note: >-
      Verifies that every image reference resolves by digest rather than by tag. Two of three bundles
      carry an empty base_image_digest with a bare tag reference, so this instrument already has a
      known positive.
  - id: SCHEMA-CHECK
    category: dataset_schema
    mandated_by: task corpus present
    implementation: .audit local module
  - id: LEAK-GATE
    category: dataset_leakage
    mandated_by: task corpus present
    implementation: .audit local module
  - id: DEDUP-CHECK
    category: dataset_dedup
    mandated_by: task corpus present
    implementation: .audit local module
  - id: REWARD-DEFINITION
    registry_name: rewarddefinition
    category: reward_integrity
    mandated_by: trajectories.present true, step 8o
    implementation: .audit local module
    composition: >-
      Composes the delivery, verifier-robustness and rubric families with feasibility, no-op,
      known-wrong and oracle-full-reward re-runs to test whether the committed checker encodes the
      stated objective. Duplicates no check those families already own.
    failure_caps: >-
      A no-op submission earning reward above the declared floor, a known-wrong control earning
      reward above the declared floor, the oracle solution not earning full reward, or a feasibility
      re-run not reproducing the recorded reward. Each is critical-capable and caps at HOLD.
    local_note: >-
      The oracle-full-reward re-run has a committed oracle in every bundle at solution/solve.sh, so
      this branch can fire. The declared floor for the no-op and known-wrong controls is the
      empty-submission requirement of exactly zero.
    disposition_cap_on_absence: HOLD
  - id: REWARD-PROVENANCE
    registry_name: rewardprovenance
    category: reward_integrity
    mandated_by: trajectories.present true, step 8o
    implementation: .audit local module
    method: >-
      Re-derives every reward figure componentwise from raw per-rollout bytes before scalarization,
      then tests scorer closure, declared capability channels and private-boundary carriers against
      the committed policy manifest.
    failure_caps: >-
      A component that does not re-derive and a scorer reading outside its declared closure are
      BLOCK. A scalarization that does not reproduce, a component depending on an undeclared channel,
      and a reachable private-boundary carrier cap at HOLD.
    local_note: >-
      policy.yaml in every bundle self-declares network_egress allowed and verifier_tree_read denied
      as unverified intent, so it is the committed policy manifest this instrument tests against
      rather than trusts. solution/TRUTH.md and solution/provenance.yaml are the private-boundary
      carriers whose reachability from the scorer must be tested.
    disposition_cap_on_absence: HOLD
  - id: ROLLOUT-INTEGRITY
    registry_name: rolloutintegrity
    category: reward_integrity
    mandated_by: trajectories.present true, step 8o
    implementation: .audit local module
    method: >-
      Recomputes rollout cardinality, canonical-byte deduplication, completeness, schema and binding,
      recomputes the trajectory Merkle root from committed bytes, and requires exact agreement with
      the operator-signed root and population sequence.
    failure_caps: >-
      A root or sequence divergence is BLOCK. Cardinality mismatch, shared canonical bytes, an
      incomplete or schema-failing rollout, and an unbound rollout cap at HOLD.
    local_condition: >-
      No operator-signed trajectory root is committed anywhere in this tree, so the required
      comparison has no counterpart and this branch resolves as coverage gap D-ROLLOUT-ROOT-UNSIGNED
      capping at HOLD. The cardinality, deduplication, completeness, schema and binding branches all
      still fire against committed bytes, so the instrument is not inert.
    scope_note: >-
      A clean result establishes custody only and never execution validity. It is never accepted in
      place of the G-FID family.
    disposition_cap_on_absence: HOLD
  - id: REWARD-DISTRIBUTION
    registry_name: rewarddistribution
    category: reward_integrity
    mandated_by: trajectories.present true, step 8o
    implementation: .audit local module
    closed_statistic_set:
      - reward_cardinality
      - reward_support
      - reward_floor_mass
      - reward_ceiling_mass
      - reward_median
      - reward_range
    method: >-
      Each figure is recomputed as an exact rational from committed per-rollout reward bytes and
      never as a floating-point summary. The set closes at six and no seventh figure is admitted,
      because an open set lets a chooser add the one statistic that clears.
    preregistration_requirement: >-
      The preregistration is committed at .audit/preregistration/<uuid>.yaml and its SHA-256 rides as
      a bound resource descriptor inside the trinity.execution/v2 pre-run commitment, whose duty to
      predate the execution interval is the ordering proof. A statistic set bound after the
      population is observed is not evidence, so a moved preregistration is BLOCK.
    local_condition: >-
      No preregistration exists and DEFERRED.md is absent, so no DEF-REWARD-STATISTICS register row
      can be cited. Phase 1 must author and bind the preregistration before the reward population is
      observed. Building this instrument never worsens the disposition against not building it, so a
      live instrument reporting an absent preregistration caps no lower than the D-COVERAGE-GAP the
      same surface carries with no instrument at all.
    disposition_cap_on_absence: HOLD
  - id: G-REF
    category: reference_fidelity
    mandated_by: reference_emulation present true
    implementation: .audit local module
  - id: G-CAL
    category: calibration
    mandated_by: difficulty and tier claims present without a signed calibration group
    implementation: .audit local module
    condition: >-
      CRUCIBLE_VIEW records e21_calibration present false with declared tiers easy, expert and hard
      and no signed calibration group. Two bundles declare difficulty_band unmeasured and one declares
      UNGRADED, while all three declare target_tier frontier-defeat, so a tier claim stands with no
      measurement behind it.
  - id: G-VER
    category: verifier_robustness
    mandated_by: verifier_robustness present true
    implementation: .audit local module
    probe_count: 7
  - id: G-RUB
    category: rubric_compilation
    mandated_by: rubric present true
    implementation: .audit local module
    probe_count: 5
  - id: G-DEL
    category: delivery_integrity
    mandated_by: committed task bundles present
    implementation: .audit local module
    sub_instruments: [G-DEL-LAYOUT, G-DEL-DISJOINT, G-DEL-SCHEMA, G-DEL-PIN, G-DEL-REWARD]
    sub_instrument_basis: >-
      Step 8g names the family members explicitly and the approved digest binds the required set by
      name, so each member is named here rather than folded into the family label. G-DEL-LAYOUT
      resolves required Harbor paths and reconciles declared steps against on-disk trees in both
      directions. G-DEL-DISJOINT re-derives task_lane residency; at a verification root there is one
      lane and no staging tree, so lane-overlap and staging-residue cannot arise, but the instrument
      still runs and records that. G-DEL-SCHEMA validates each task manifest against the schema
      version projected through CRUCIBLE_VIEW as bound at sign-off, and an unprojected version
      invokes the governing coverage gap rather than validating against whatever version is
      installed. G-DEL-PIN confirms every container image reference carries an @sha256 digest and
      that the declared network policy matches the environment producing the committed evidence.
      G-DEL-REWARD confirms the verifier terminates by writing the bound reward contract path and
      that every committed zero score carries a machine-readable reason.
    disposition_cap_on_absence: HOLD
  - id: G-DEL-ORACLE
    category: executable_oracle_verification
    mandated_by: executable oracle present in every bundle
    implementation: .audit local module
  - id: G-TRUTH-REGEN
    category: generated_ground_truth_regeneration
    mandated_by: generated ground truth present in every bundle
    implementation: .audit local module
    note: >-
      solution/recompute.py is deterministic over grounding.yaml with no network, model or clock
      dependency, so regeneration is checkable under frozen bytes. Line 225 of every copy carries an
      invalid escape sequence emitting a SyntaxWarning, which is a pre-existing defect and a standing
      finding candidate.
  - id: G-DEL-COLLISION
    category: bundle_uuid_collision
    mandated_by: committed task bundles present
    implementation: trinity/tools/collision.py check ./ <uuid> --json
  - id: G-DEL-LINEAGE
    category: bundle_lineage
    mandated_by: committed task bundles present
    implementation: .audit local module
  - id: G-PROV-UPSTREAM
    category: upstream_provenance_reconciliation
    mandated_by: step 8c
    implementation: .audit local module
    method: >-
      Re-runs the upstream-provenance reconciliation independently and never trusts the author claim.
      Recomputes against committed bundle bytes that every task carries one upstream_provenance
      record, that every record carries a parseable per-instance train-cutoff date, that every
      derived record names a non-empty upstream identity, license and modification list, and that no
      declared origin contradicts the asset license chain or the report prose.
    known_positives_at_scope_time:
      - >-
        Bundles 6bf0c918 and 873914cf both declare license unresolved while declaring origin derived
        from reflex-dev/reflex. A derived record missing the license sub-field is a retained
        domain-integrity finding under step 8c.
      - >-
        Every bundle records task_generating_event_at null, so no record carries a parseable
        per-instance train-cutoff date. A missing or absent cutoff date is a retained
        domain-integrity finding under step 8c.
    input_restriction: consumes only CRUCIBLE_VIEW and committed bundle bytes, never FORGE self-attestation
    disposition_effect: may only lower disposition
    disposition_cap_on_absence: HOLD
  - id: G-CON
    category: contamination_screening_floor
    mandated_by: contamination surface carries no presence gate
    implementation: .audit local module
    sub_instruments: [G-CON-EXCLUSION, G-CON-FREEZE, G-CON-NEARDUP, G-CON-STRIP, G-CON-EMPTY, G-CON-RECORD]
    sub_instrument_name_basis: >-
      Step 8i names the six instruments exactly as G-CON-EXCLUSION, G-CON-FREEZE, G-CON-NEARDUP,
      G-CON-STRIP, G-CON-EMPTY and G-CON-RECORD. The earlier working labels G-CON-SANITIZATION and
      G-CON-PROVENANCE are not contract names and are dropped, because the approved digest binds the
      required-instrument set by name and an unnamed instrument is unbound.
    disposition_cap_on_absence: HOLD
  - id: G-FID
    category: execution_fidelity
    mandated_by: trajectories.present true, step 8u
    implementation: .audit local module
    sub_instruments: [G-FID-CONFIG, G-FID-TRACE, G-FID-POPULATION, G-FID-HANDOFF]
    ledger: .audit/fidelity.yaml
    sub_instrument_detail: >-
      G-FID-CONFIG re-derives the harness-config binding from committed bytes and compares it against
      the attested effective configuration; drift or absence caps at HOLD, and a configuration
      unapproved or inadequate for the declared horizon caps at HOLD even when pinned, signed and
      reproducible. G-FID-TRACE runs registered family adapters over committed rollout bytes, emits a
      three-valued fidelity_coverage outcome per rollout across the eight signal classes, derives the
      trial status under trinity.trial-conformance/v1 as conforming, nonconforming or indeterminate,
      and refuses when the operator declaration disagrees with the derived status. G-FID-POPULATION
      reconciles realized groups against the precommitted roster at the fixed group count and never
      lowers that count to fit what arrived. G-FID-HANDOFF verifies the identity of the final
      submission reaching the scorer against the submission the solver produced.
    population_hazard:
      severity: potential_BLOCK
      statement: >-
        Step 8u states that a population that cannot be proven is BLOCK, because an unprovable
        population is no measurement rather than a weak one. No precommitted roster and no fixed
        group count exist anywhere in this tree, and the realized population is two solver identities
        at one run each per bundle. If Phase 1 cannot resolve a precommitted roster, G-FID-POPULATION
        yields BLOCK and the author lane records BLOCK:INVALID_PILOT with no suppression reason. This
        is the single most likely path by which this run terminates at BLOCK rather than HOLD, and it
        is recorded here so the sign-off binds it rather than discovering it at disposition time.
    hold_reason_precedence:
      - config-unpinned
      - config-drift
      - config-inadequate
      - handoff-unverified
      - context-uncovered
      - fidelity-unverified
    note: >-
      Required rather than optional because committed trajectories exist. Class 17 carries no
      exemption for a finding that would lower a measured pass rate. Each instrument is pure Bucket D
      and may only lower or cap a disposition.
    disposition_cap_on_absence: HOLD
  - id: G-ADV
    category: adversarial_probes
    mandated_by: Phase 1 step 8t
    implementation: .audit local module
    probe_count: 8
  - id: G-BUD
    category: budget_conformance
    mandated_by: budget blocks present in every task.toml
    implementation: .audit local module
    condition: >-
      Every bundle declares build_timeout_sec 3600, cpus 8, memory_mb 16384, agent timeout_sec 57600
      and verifier timeout_sec 3600, so the budget block is present and 8s applies.
  - id: EXECUTION-ATTESTATION
    category: execution_attestation
    mandated_by: Phase 1 step 8p
    predicate: trinity.execution/v2
    format: dsse
    output_path: .audit/attestations/execution/
  - id: REWARD-COVERAGE-LEDGER
    category: reward_coverage
    mandated_by: Phase 1 step 8q
    implementation: .audit local module

scanner_policy:
  command_policy: >-
    Every scanner is invoked through an argv builder registered in the Phase 1 instrument registry
    with an explicit timeout and an explicit rule or database pin. No scanner resolves rules over the
    network at run time. semgrep --config auto is forbidden outright.
  database_pinning: >-
    Vulnerability and rule databases are pinned by snapshot digest inside .audit and recorded in
    evidence.yaml alongside each result, so a later re-run against a moved database is detectable
    rather than silent.
  config_digests:
    state: declared_pending_with_unconditional_resign
    commitment: >-
      Phase 0 stops before any harness file is written, so no scanner config bytes exist to digest at
      sign-off time. Recording a vacuous binding would be worse than recording none, because Phase
      0.5 step 3 makes a semantic change that does not move the digest fail closed. This scope
      therefore names every config path that Phase 1 will author with an explicit null digest, and
      binds an unconditional commitment: the first Phase 1 authoring of any config listed below
      invalidates this approval and re-triggers Phase 0.5 sign-off without exception, whether or not
      the authored content matches any expectation stated here. No config may be authored under this
      approval.
    paths:
      - path: .audit/configs/semgrep.yaml
        instrument: PY-STATIC
        digest: null
      - path: .audit/configs/bandit.yaml
        instrument: PY-SECURITY
        digest: null
      - path: .audit/configs/ruff.toml
        instrument: PY-LINT
        digest: null
      - path: .audit/configs/osv.lock.json
        instrument: DEP-VULN
        digest: null
      - path: .audit/configs/trufflehog.yaml
        instrument: SECRET-SCAN-HISTORY
        digest: null
      - path: .audit/configs/hadolint.yaml
        instrument: CONTAINER-LINT
        digest: null
      - path: .audit/configs/grype.yaml
        instrument: CONTAINER-VULN
        digest: null
      - path: .audit/configs/syft.yaml
        instrument: CONTAINER-SBOM
        digest: null
  host_availability_summary: >-
    Of the scanners this scope requires, only ruff, docker and jq are present on the host. semgrep,
    trufflehog, osv-scanner, syft, grype, hadolint, trivy, gitleaks, bandit and pip-audit are all
    absent. uv and uvx are available, so Phase 1 provisions pinned versions inside .audit rather than
    depending on host state. The docker daemon is running, so container instruments can execute
    locally subject to registry credentials.

reward_fixture_manifest:
  path: .audit/fixtures/reward/v1/manifest.yaml
  aggregate_digest: 833f39015a576ec6abce85c01332360e661777fd56c9149f9593b24f249fce2f
  state: bound
  binding: >-
    Step 12d requires the aggregate digest of the reward fixture manifest to be bound into both
    .audit/scope.yaml and .audit/scope.approved so that a fixture edit re-triggers sign-off and
    cannot silently retune the gate. The fixture tree was authored in Phase 1, which invalidated
    the Phase 0.5 approval that carried a null digest and re-triggered sign-off. The digest above
    is recomputed by rewardfixtures.aggregate_digest over every fixture path and its own digest in
    sorted order, so editing any fixture byte moves it and re-triggers sign-off again.
  atom_count: 5
  derivation_count: 4
  demonstrated_subjects: 9
  structure_required:
    - .audit/fixtures/reward/v1/manifest.yaml
    - .audit/fixtures/reward/v1/atoms/
    - .audit/fixtures/reward/v1/derivations/
  rules:
    - every reward atom carries a planted positive and a clean fixture
    - >-
      every derivation rule carries a planted positive and a near miss satisfying all join predicates
      but one, which must not fire, because the near miss is what proves a rule has not degenerated
      into correlation
    - >-
      manifest.yaml binds the fixture schema version, every atom and rule identifier, both paths per
      subject, the canonical digest of every fixture, the expected normalized outcome, and a
      no-production sentinel
    - >-
      a bundle-shaped fixture is a fixture package and never a task bundle: it lives only below
      .audit/fixtures/, carries fixture_only true under a reserved non-production identity, never
      enters a pilot, and never appears under samples/ or delivery/
  separation: >-
    These fixtures are held separate from the negative-control suite, which tests gate-level failure
    behaviour rather than instrument liveness, so one term never names both a defective sample and a
    clean control.

evaluated_not_mandated:
  - id: G-OPT
    category: optimization_scoring
    determination: does_not_fire
    basis: >-
      Step 8r fires only on an optimization tag. No task.toml carries one. Keywords across the three
      bundles are rust, issue-resolving, mise, python, reflex and agent:openhands-sdk, and every
      graded outcome is a pass-or-fail test verdict with no score dimension over speed, memory or
      cost. This entry is recorded outside required_instruments so the bound required set contains
      only genuinely required names.
  - id: NODE-SCANNERS
    category: node_ecosystem
    determination: does_not_fire
    basis: >-
      No package.json and no Node lockfile ships as a bundle-level file. Reflex compiles to React and
      JSX strings appear inside format assertions, but no Node manifest is committed, so Node
      scanners are not mandated by step 7.

coverage_gaps:
  - id: D-CON-PRODUCER-DETERMINATION-ABSENT
    surface: contamination_screen
    caps: HOLD
    statement: >-
      Across three resident bundles, eighteen atom determinations are expected and fifteen are absent
      on the producer side. Nine are absent because every ENGRAM root determination is keyed to three
      foreign task_uuid_v5 values with empty overlap against the resident set, covering exclusion,
      freeze and near-duplicate for each bundle. Three more are the per-unit provenance records,
      which exist in band but are unsigned with no trust root. Three more are the sanitization and
      empty-submission atoms, which the producer marks measured while recording the result digest and
      the measured reward as unmeasured, leaving the claim with no recomputable artifact behind it.
      The count is fifteen of eighteen, not nine.
    scope_limit: >-
      This gap is about the absence of a PRODUCER determination and never about the auditor's ability
      to derive one. Step 8i requires each instrument to derive its own result from committed bundle
      bytes before comparing claims, and a producer pass assertion is never evidence in any case, so
      for exclusion and near-duplicate the missing claim removes only the comparison counterpart and
      not the measurement. G-CON-EXCLUSION and G-CON-NEARDUP therefore run against resolved roots in
      Phase 1 and are not inert.
    closable_by: an ENGRAM screening run keyed to the three resident task_uuid_v5 values
    closable_by_this_run: false
  - id: D-CON-FREEZE-UNDERIVABLE
    surface: contamination_screen
    caps: HOLD
    statement: >-
      The freeze atom is underivable for every resident bundle. Step 8i requires the
      task-generating-event timestamp, meaning issue creation or the bug-introducing change rather
      than a rewritable commit timestamp. Every bundle records task_generating_event_at null with
      task_generating_event_state unresolved, and the only dates available are upstream commit
      timestamps, which step 8i names as rewritable and therefore inadmissible. This is the one
      contamination atom the auditor cannot recompute locally.
    aggravating_factor: >-
      Bundle 873914cf carries an upstream change dated 2023-02-21, earlier than every per-set cutoff
      in the freeze table including the earliest at 2023-08-01, so it is the unit most likely to sit
      inside a public training window and it is precisely the unit whose freeze determination cannot
      be derived.
    closable_by: an attested task-generating-event timestamp from a non-rewritable source
    closable_by_this_run: false
  - id: D-CON-UNMEASURED-ATOM
    surface: contamination_screen
    caps: HOLD
    statement: >-
      Six atoms across three bundles, the sanitization and empty-submission atoms of each, are marked
      state measured by the producer while carrying result_digest unmeasured and measured_reward
      unmeasured. A measured claim with no recomputable artifact is not a measurement. This is
      load-bearing for the empty-submission atom in particular, because run_tests.py states at its
      own lines 8 and 9 that the grading code this family descends from returns a perfect score for
      an empty target set, which is exactly the defect the atom exists to catch.
    closable_by: independent remeasurement under G-CON-STRIP and G-CON-EMPTY in Phase 1
    closable_by_this_run: true
  - id: D-HISTORY-SCAN-SUBSTRATE
    surface: full_git_history
    caps: HOLD
    statement: >-
      Step 7 mandates full-history secret scanning, but this checkout's .git is a gitdir-pointer file
      rather than a directory, so the history walk truncates for the same structural reason recorded
      in D-PARENT-LAYOUT-SCAN-TRUNCATED. SECRET-SCAN-HISTORY must not report clean over a substrate
      it could not read. Phase 1 proves the walk is live with a both-halves fixture, a planted secret
      in a historical commit that must fire and a clean history that must stay silent, before any
      clean result from this instrument is admitted.
    closable_by: resolving the gitdir pointer to a readable object store, or auditing a standalone clone
    closable_by_this_run: false
    conditional_note: >-
      The both-halves fixture proving liveness is buildable within this run, but the underlying
      substrate defect is structural to a submodule checkout and is not closable here.
  - id: D-ROLLOUT-ROOT-UNSIGNED
    surface: trajectories
    caps: HOLD
    statement: >-
      Step 8o requires rolloutintegrity to recompute the trajectory Merkle root from committed bytes
      and require exact agreement with the operator-signed root and population sequence. No
      operator-signed root and no population sequence is committed anywhere in this tree, so that
      branch has no counterpart. The cardinality, deduplication, completeness, schema and binding
      branches still fire, so the instrument is not inert.
    closable_by: the operator committing a signed trajectory root and population sequence
    closable_by_this_run: false
  - id: D-REWARD-PREREGISTRATION-ABSENT
    surface: trajectories
    caps: HOLD
    statement: >-
      Step 8o binds rewarddistribution to a preregistration at .audit/preregistration/<uuid>.yaml
      whose SHA-256 rides as a bound resource descriptor inside the trinity.execution/v2 pre-run
      commitment. None exists. Step 8o resolves an absent preregistration under step 7g only while
      DEF-REWARD-STATISTICS stands in the deferred register, and DEFERRED.md is absent here, so no
      register row can be cited. Phase 1 must author and bind the preregistration before the reward
      population is observed, because a statistic set bound after observation is BLOCK.
    closable_by: authoring and binding the preregistration in Phase 1 before observing the population
    closable_by_this_run: true
  - id: D-FID-POPULATION-UNPROVABLE
    surface: trajectories
    caps: BLOCK_IF_UNRESOLVED
    statement: >-
      Step 8u states that a population that cannot be proven is BLOCK, because an unprovable
      population is no measurement rather than a weak one. No precommitted roster and no fixed group
      count exists in this tree. The realized population is two solver identities at one run each per
      bundle. If Phase 1 cannot resolve a precommitted roster, G-FID-POPULATION yields BLOCK and the
      author lane records BLOCK:INVALID_PILOT with no suppression reason.
    escalation_note: >-
      This is the single most likely path by which this run terminates at BLOCK rather than HOLD. It
      is recorded at sign-off rather than discovered at disposition time, because a run that
      discovers a governing condition only at disposition time has failed to scope.
    closable_by: a precommitted roster with a fixed group count
    closable_by_this_run: false
  - id: D-PROV-UPSTREAM-INCOMPLETE
    surface: per_unit_provenance
    caps: HOLD
    statement: >-
      Step 8c requires every derived record to name a non-empty upstream identity, license and
      modification list, and every record to carry a parseable per-instance train-cutoff date.
      Bundles 6bf0c918 and 873914cf declare origin derived with license unresolved, and all three
      bundles record task_generating_event_at null so no per-instance cutoff date is parseable. Each
      is a retained domain-integrity finding under step 8c rather than a clean scan.
    closable_by: the producer completing the license chain and recording attested event timestamps
    closable_by_this_run: false
  - id: D-CON-ATTESTATION-UNAVAILABLE
    surface: neardup_parameters and per-unit provenance
    caps: HOLD
    statement: >-
      Every resident bundle records attestation_state attestation-unavailable with null ancestry and
      event attestation digests and signers, and CRUCIBLE_VIEW records the source-attestation trust
      root as root_number 6 with status ABSENT and identity null. Fork-ancestry closure membership is
      therefore unresolvable at both ends.
    closable_by: provisioning an independent platform attestation authority
    closable_by_this_run: false
  - id: D-SIGNED-CHECKPOINT-ABSENT
    surface: feedback_chain
    caps: HOLD
    statement: >-
      feedback.py walk exits with FEEDBACK_CHAIN_BROKEN because the walk requires a signed checkpoint
      over the chain head and this verification root has no trust root and no enrolled
      feedback_checkpointer key. The appends themselves succeeded and the chain is internally
      consistent, but it carries no signature.
    closable_by: a human enrolling a feedback_checkpointer key in a trust root at this checkout
    closable_by_this_run: false
  - id: D-APPROVAL-ENVELOPE-UNSIGNED
    surface: approval_gate
    caps: HOLD
    statement: >-
      The Phase 0.5 scope sign-off was discharged by writing the SHA-256 of this file into
      .audit/scope.approved under the gate_approver role the project trust root names, but no
      accompanying trinity.approval/v1 signed envelope exists at .audit/scope.approved.dsse.json.
      No signing key bearing that role is enrolled in this verification root and the trust root
      records the gate_approver evidence as a document signature block rather than as key material,
      so no conforming envelope is producible here. The integrity gate raises
      APPROVAL_ENVELOPE_MISSING against this state and that finding is correct. The approval is
      therefore recorded rather than attested, and it grants no exemption, lowers no floor, and
      closes no other gap.
    closable_by: a human enrolling a gate_approver signing key and emitting a trinity.approval/v1 envelope over the approved digest
    closable_by_this_run: false
  - id: D-GATE-PROTECTION-MISSING
    surface: repository_governance
    caps: HOLD
    statement: >-
      Branch protection is not in force on EtharaOrion/levi-samples. The GitHub API returns 404 for
      the protection endpoint, so no classic protection and no ruleset is applied.
    closable_by: a repository administrator applying protection or a ruleset with no bypass actors
    closable_by_this_run: false
  - id: D-PARENT-LAYOUT-SCAN-TRUNCATED
    surface: repository_layout
    caps: HOLD
    statement: >-
      This checkout's .git is a gitdir-pointer file because it is a submodule of the outer tree, and
      safe_git refuses a non-directory .git, so the layout scan truncates.
    closable_by: auditing a standalone clone carrying a real .git directory
    closable_by_this_run: false
  - id: D-INTEGRITY-PARENT-ROSTER
    surface: repository_documentation
    caps: HOLD
    statement: >-
      The gate grades the full parent roster even at a verification root. The documentation spine,
      the shared directories, the root reports and the README showcase sections are all absent or
      incomplete, and the README closes on Screening roots rather than on Contact.
    closable_by: authoring the parent roster, or an upstream contract change exempting verification roots
    closable_by_this_run: false
  - id: D-AUDIT-FORBIDDEN-PATH-CITATION
    surface: gate_receipts
    caps: HOLD
    statement: >-
      integrity.py check_audit_forbidden_paths scans .audit evidence files for citations of the
      forbidden hardness surfaces, and a committed gate receipt at
      .audit/runs/<run>/gate-receipts/preflight-0005.json line 198 quotes the string missing root
      report HARDNESS.md as part of its own verbose finding list. The gate therefore flags its own
      tool-emitted receipt. No CRUCIBLE-authored evidence file cites a forbidden path.
    closable_by: an upstream change to either the receipt verbosity or the citation check
    closable_by_this_run: false
  - id: D-DEP-LOCKFILE-ABSENT
    surface: dependency_manifests
    caps: HOLD
    statement: >-
      No bundle commits a lockfile. Every lockfile path appears only inside solution/fix.patch diffs,
      so a committed-tree dependency scan has no manifest to read and DEP-VULN cannot fire against
      committed bytes alone.
    closable_by: resolving manifests from the pinned image, subject to registry access
    closable_by_this_run: false
    conditional_note: >-
      Closable within this run only if registry credentials for the private ECR namespace are
      available at Phase 2 run time. They are not available at scope time, so the boolean records
      false and this note carries the condition.
  - id: D-EVALUATOR-IMAGE-UNPINNED
    surface: delivery_closure
    caps: HOLD
    statement: >-
      No bundle pins the evaluator image its measurement ran on. Bundle 4c7b8d6f states this
      explicitly. The bound closure covers the sanitized image built from the committed Dockerfile,
      not the image any recorded trajectory executed against, so execution fidelity cannot be closed
      against a pinned evaluator.
    closable_by: the producer recording the evaluator image digest per measurement
    closable_by_this_run: false
  - id: D-COMPILATION-FLOOR-UNRESOLVED
    surface: rubric
    caps: HOLD
    statement: >-
      The rubric compilation floor reads conservative-default-unresolved and is carried by name only
      from .seed/contract.yaml, which does not exist at this root, so the floor cannot be resolved
      from committed bytes and G-RUB has no threshold to test compilation completeness against.
    closable_by: pinning a floor value in requirements or resolving the named seed contract
    closable_by_this_run: false
  - id: D-MEASUREMENT-PROVENANCE-UNRECORDED
    surface: per_unit_provenance
    caps: HOLD
    statement: >-
      Every bundle records measurement_provenance state unrecorded, asserting nothing about the image
      it was measured on or about any reference content excluded from it, so no measured numbers in
      any bundle can be attributed to a known measurement configuration.
    closable_by: the producer recording measurement provenance per slot
    closable_by_this_run: false
  - id: D-NEGCONTROL-BINDING-RECOMPUTE-UNDEMONSTRABLE
    surface: harness_code
    caps: HOLD
    statement: >-
      Step 12 requires a negative control for a committed binding block diverging from the
      independently recomputed block. The recompute needs a projected canonical bundle hash input,
      none is projected at this root, and G-CON-RECORD therefore emits a coverage gap rather than
      deriving a block to compare. A fixture cannot manufacture the missing projection, so the
      control is recorded unrun in the selfcheck receipt rather than demonstrated.
    closable_by: the direction source projecting the canonical bundle hash input
    closable_by_this_run: false
  - id: D-NEGCONTROL-LAYER-SET-UNDEMONSTRABLE
    surface: containers
    caps: HOLD
    statement: >-
      Steps 12 and 12a require a negative control for a git object database surviving only in a
      whiteouted lower layer. No image layer set resolves at this root, and step 8i states that
      resolving only a merged filesystem does not satisfy history absence. G-CON-STRIP therefore
      records the shortfall as unimplemented on every input, which cannot be converted into a
      demonstration without an unpacked layer set.
    closable_by: an unpacked layer set for the pinned images becoming resolvable
    closable_by_this_run: false
  - id: D-NEGCONTROL-ROOT-DRIFT-UNDEMONSTRABLE
    surface: task_corpus
    caps: HOLD
    statement: >-
      Step 12c requires root-drift fixtures proving each screening check stays clean for a bundle
      passing under the effective root and fires on a bundle that passed under its shipped-under
      root and fails under the effective one. The shipped-under root digest is unresolvable at this
      root, so no differential is computable and all three root-drift controls are recorded unrun.
    closable_by: the shipped-under root digest becoming resolvable for each committed bundle
    closable_by_this_run: false
  - id: D-NEGCONTROL-EMPTY-SUBMISSION-UNDEMONSTRABLE
    surface: containers
    caps: HOLD
    statement: >-
      Step 12 requires a negative control for an empty submission that resolves a fail-to-pass
      target. The control requires replaying the empty submission inside the pinned image against
      the frozen checker set, no image resolves at this root, and inventing a measured reward would
      be a fabricated demonstration rather than evidence.
    closable_by: a pinned evaluator image resolving so the replay can run
    closable_by_this_run: false

ambiguities:
  - id: A-VIEW-EXEMPTION-REFUTED
    statement: >-
      CRUCIBLE_VIEW declares e20_reference_fidelity present false under a greenfield exemption, and
      the audited bytes refute it directly with named external symbols, a named versioned upstream
      and golden-string assertions. Rule 9a fixes the asymmetry that a projection only ever tightens
      a parameter or lowers a disposition and never grants one, so an auditor reading no projection
      is stricter than one reading any. Steps 7a, 7b and 7c condition present false on the TREE
      rather than on a view declaration, and steps 8d, 8f and 8h supply only an upward channel by
      which a standing integrity priority forces present true. There is no downward channel, so a
      view-declared exemption the tree refutes is not a grant this instrument may accept. The
      override is lawful and the three families stay in scope.
    resolution_path: recorded for ENGRAM reconciliation, no local action
  - id: A-VIEW-SCOPE-CLAIM-FALSE
    statement: >-
      exclusion_list.json limitation one asserts the root scopes to the three bundles the samples tree
      holds, and source_attestation.json cites bundle paths under foreign uuids that do not exist in
      this checkout. Either the roots were computed against a prior state of this tree that has since
      been replaced, or they were computed against a different tree entirely. The committed bytes
      cannot distinguish the two.
    resolution_path: an ENGRAM-side determination, out of scope for this instrument
  - id: A-STACK-LINEAGE-VERSION
    statement: >-
      The exclusion-list root names bigcode/the-stack rather than the-stack-v2. 7f requires the Stack
      lineage and the lineage is named, so no row is missing, but the documented near-duplicate hazard
      of roughly forty percent belongs to v2 specifically.
    resolution_path: confirm which Stack version the screen resolved against
  - id: A-NEARDUP-REPRESENTATION-MISMATCH
    statement: >-
      The index pairwise maxima of 0.398148, 0.409719 and 0.497507 sit above the calibrated detection
      floor of 0.393291, but the root's own limitation records that those maxima were computed over
      the raw instruction representation while the floor was calibrated over the payload
      representation with the harness envelope stripped. Comparing them is not meaningful, yet the two
      numbers sit adjacent in the same root.
    resolution_path: recompute pairwise similarity over the payload representation
  - id: A-TIER-CLAIM-WITHOUT-MEASUREMENT
    statement: >-
      All three bundles declare target_tier frontier-defeat while declaring difficulty_band UNGRADED
      or unmeasured, and the recorded trajectory rewards are 0.0, 0.5 and 0.5 from two models on a
      single run each. A sample of two rollouts per bundle cannot support a tier claim, and under the
      Phase R small-n finding no interval may be emitted at this size.
    resolution_path: G-CAL measures the gap between the claim and the evidence
  - id: A-RECOMPUTE-SYNTAX-WARNING
    statement: >-
      Line 225 of every solution/recompute.py carries an invalid escape sequence emitting a
      SyntaxWarning under Python 3.12 and later. It is pre-existing and identical across bundles, so
      it is a generator defect rather than per-bundle drift, but it means the ground-truth regenerator
      does not run warning-clean on a current interpreter.
    resolution_path: G-TRUTH-REGEN records whether the warning affects regenerated bytes

capabilities:
  reference: .audit/capabilities.yaml
  binding: >-
    The Phase 0.5 approved digest binds the capability block, so any flip of a capability state
    invalidates approval and re-triggers sign-off.
