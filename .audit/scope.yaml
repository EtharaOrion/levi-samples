        disposition_gap_id: D-CON-UNMEASURED-ATOM
        phase_1_action: independent remeasurement under G-CON-STRIP and G-CON-EMPTY
      empty_submission_validation:
        applicability: applicable
        state: producer_claimed_measured
        measured_reward: unmeasured
        disposition: D-COVERAGE-GAP
        disposition_gap_id: D-CON-UNMEASURED-ATOM
        phase_1_action: independent remeasurement under G-CON-STRIP and G-CON-EMPTY
      per_unit_provenance_record:
        applicability: applicable
        state: present_unsigned
        disposition: D-COVERAGE-GAP
        aggravating_factor: license reads unresolved, so redistribution standing is undetermined
  synthetic_source_kind:
    claimed: false
    basis: >-
      Every bundle declares source_kind public_repository with origin derived. No bundle claims
      synthetic origin, so the closed generator-origin predicate is never invoked and no
      repository-bound relation is exempted on that path. Deterministic reproduction through
      solution/recompute.py is still checked under G-TRUTH-REGEN, but it establishes regeneration and
      never origin.
  mandates: [G-CON, G-CON-EXCLUSION, G-CON-FREEZE, G-CON-NEARDUP, G-CON-STRIP, G-CON-EMPTY, G-CON-RECORD]

neardup_parameters:
  source: CRUCIBLE_VIEW and the near-duplicate index and calibration roots
  neardup_threshold: 0.3
  neardup_review_threshold: 0.15
  neardup_detection_floor: 0.393291
  neardup_floor_recall: 1.0
  neardup_floor_false_positive_rate: 0.0
  neardup_calibration_digest: 6d49c5ffa5728bd7897ceae5314a06229b2411b0bdd478e1f83329cca5841e8e
  neardup_normalizations: [nfkc_fold, lowercase, strip_diff_coordinates, strip_hex_object_ids]
  corpus_snapshot_digest: 3f8669dadcb03fb8790978d11f4b7e38bb88cda48eca62256a729f5518b7ff31
  corpus_unit_count: 1391
  corpus_sources: [levi_dataset, milo_bench, swe_bench_verified, swe_gym]
  floor_basis: midpoint of the observed separation band
  separation_band: 0.77186
  negative_comparison_count: 4164
  floor_detected_positives: 3
  floor_false_positives: 0
  calibration_positive_control_count: 3
  floor_measured: true
  calibration_pinned: true
  attestation_declarations:
    ancestry_attestation_digest: null
    ancestry_attestation_signer: null
    event_attestation_digest: null
    event_attestation_signer: null
    attestation_state: attestation-unavailable
    state: absent_for_every_resident_bundle
  disposition: D-COVERAGE-GAP
  disposition_basis: >-
    The measured floor exists and the calibration set is pinned, so those two sub-conditions are
    satisfied. The attestation condition is not: every resident bundle records attestation_state
    attestation-unavailable with null ancestry and event attestation digests and signers, and the
    source-attestation trust root is recorded ABSENT in CRUCIBLE_VIEW with status ABSENT and
    identity null. An unavailable attestation is D-COVERAGE-GAP capping at HOLD.
  method_limitations_recorded:
    - >-
      The index pairwise block scores the raw instruction representation where shared harness
      boilerplate is between forty-eight and sixty-five percent of each instruction and carries the
      whole match band, and the calibrated floor does not transfer to that representation. Recorded
      pairwise maxima of 0.398148, 0.409719 and 0.497507 therefore sit above the 0.393291 floor for
      reasons the floor was never calibrated to interpret.
    - >-
      The positive class is three real pairs, so recall of 1.0 rests on a sample of three and carries
      no meaningful interval. Under the Phase R finding from arXiv:2503.01747 no central-limit
      interval may be emitted at this sample size.
    - >-
      The external corpus is a 1391-unit snapshot of four sources, so a clean screen bounds
      duplication against what is pinned rather than certifying absence.
    - >-
      Semantic duplicates that share no upstream identity fall outside the labelled positive class
      and are unmeasured. This is a method limitation and never an instance property.

