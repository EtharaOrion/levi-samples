trajectories:
  present: true
  presence_basis: >-
    Steps 8o and 8u both gate literally on this key being true, so it is carried as a top-level
    detection block rather than only as a row in the surface table. Every bundle commits two rollouts
    under trajectories/, so the trajectories surface is present and both the REWARD-INTEGRITY family
    and the G-FID family are required.
  signals:
    - >-
      Two agent identities per bundle, claude-opus-5 and zai__glm-5.3, each with a single run_1
      directory carrying agent/, artifacts/, config.json, lock.json, result.json, trial.log and
      verifier/.
    - >-
      Verifier-side reward records at trajectories/<agent>/run_1/verifier/ carrying reward.json,
      reward.txt, reward_reason.json, summary.json, process.json, efficiency.json, final_score.md,
      final.diff, target-stdout.md and preserve-stdout.md.
    - >-
      Model identity recorded in both config.json and result.json, so the solver identity behind each
      rollout is legible from committed bytes.
  rollout_population:
    declared_agents: [claude-opus-5, zai__glm-5.3]
    runs_per_agent: 1
    rollouts_per_bundle: 2
    total_rollouts: 6
    group_count_basis: >-
      Two solver identities at one run each. No precommitted roster exists at this root, so
      G-FID-POPULATION has no precommitted group count to reconcile against and the realized
      population cannot be proven from committed bytes alone.
  per_bundle:
    - uuid: 4c7b8d6f-c500-585d-b7b2-3519df55b1b3
      file_count: 39
      approx_bytes: 7.5MB
      recorded_reward: 0.0
    - uuid: 6bf0c918-e9ad-5397-bb76-cf3e238f2df1
      file_count: 36
      approx_bytes: 6.5MB
      recorded_reward: 0.5
    - uuid: 873914cf-93b2-57a0-a5c8-264bfa2d3b66
      file_count: 38
      approx_bytes: 5.3MB
      recorded_reward: 0.5
  trajectory_schema:
    top_level_keys: [schema_version, session_id, agent, steps, final_metrics]
  preregistration:
    path: .audit/preregistration/<uuid>.yaml
    state: absent
    consequence: >-
      Step 8o binds rewarddistribution to a preregistration whose SHA-256 rides as a bound resource
      descriptor inside the trinity.execution/v2 pre-run commitment. No preregistration exists yet.
      Step 8o resolves an absent preregistration under step 7g only for as long as DEF-REWARD-STATISTICS
      stands in the deferred register, and DEFERRED.md is absent at this root, so no register row can
      be cited. Phase 1 must therefore author the preregistration and bind it before the reward
      population is observed, because a statistic set bound after observation is BLOCK.
  operator_signed_trajectory_root:
    state: absent
    consequence: >-
      Step 8o requires rolloutintegrity to recompute the trajectory Merkle root from committed bytes
      and require exact agreement with the operator-signed root and population sequence. No
      operator-signed root is committed anywhere in this tree, so the comparison has no counterpart.
      This is recorded as coverage gap D-ROLLOUT-ROOT-UNSIGNED.
  mandates: [REWARD-DEFINITION, REWARD-PROVENANCE, ROLLOUT-INTEGRITY, REWARD-DISTRIBUTION, G-FID-CONFIG, G-FID-TRACE, G-FID-POPULATION, G-FID-HANDOFF]

reference_emulation:
  present: true
  signals:
    - >-
      Every bundle carries an interface_spec block in task.toml with mode names-only, naming exact
      external symbols the graded change must expose. Bundle 4c7b8d6f names the command-line flag
      --minimum-release-age. Bundle 6bf0c918 names nine Reflex API symbols including
      EventActionsMixin.prevent_default(self) and EventHandler.stop_propagation, plus typed
      signatures such as def requires_access_token() -> str. Bundle 873914cf names Icon.create,
      Upload.create, Tag.args and utils._issubclass with an explicit generic signature.
    - >-
      Each bundle grades against a named, versioned upstream project at a pinned base commit SHA,
      and solution/fix.patch is a reference implementation derived from real merged upstream pull
      requests.
    - >-
      Bundle 4c7b8d6f grades a .NET runtime installation path in mise that shells out to the
      external dotnet-install selector, an externally existing command-line tool whose interface the
      change must satisfy.
    - >-
      tests/rubrics.json probe blocks assert exact golden strings against final.diff, for example
      the literal workflow fragment "github.event.pull_request.author_association != 'OWNER' &&".
  upstream_identity:
    - jdx/mise at e26b4e78d9391891b38f3cce2cc34f2f9d0d0396
    - reflex-dev/reflex at 269334014d4dd717f7a8424e9af2c87ed6e82fb0
    - reflex-dev/reflex at 977cc6990f22cbd1f11049aef6f9b9bb63af7f3f
  pinned_version: >-
    Pinned by upstream base commit SHA per bundle and by the sanitized image digest each bundle
    binds. No semantic version string is declared for any upstream.
  view_declaration_conflict:
    view_field: e20_reference_fidelity
    view_value: 'present: false with reason greenfield exemption'
    scope_value: 'present: true'
    treatment: >-
      CRUCIBLE_VIEW declares a greenfield exemption for reference fidelity, and the rows carrying
      that declaration are keyed to three units that are not resident in this tree. The audited
      bytes contradict the exemption directly: named external symbols, a named versioned upstream
      and golden-string assertions are all present. The contract exempts only a tree with no
      external referent, so the local detection stands and Phase 1 REFERENCE-FIDELITY instruments
      are mandated. The conflict is retained as a domain-integrity finding.
  mandates: [G-REF]

verifier_robustness:
  present: true
  signals:
    - a committed parser and target matcher at tests/harness_core.py
    - declared fail-to-pass and preserve target sets in tests/config.json
    - a recorded patch-apply step for the verifier-owned test patch
    - reward derived entirely from parsed stdout and stderr
  parser_identity:
    module: tests/harness_core.py
    byte_identical_across_bundles: true
    identity_basis: >-
      diff confirms tests/harness_core.py is byte identical across all three bundles, and
      tests/run_tests.py likewise. run_tests.py line 37 imports PARSERS, collect_reports and
      resolve_declared from that one module. Grading is custom line-oriented regex and string
      scraping over concatenated stdout and stderr, not a pytest JSON report and not JUnit XML by
      default. The parser is selected by the config.json parser key through the PARSERS dict at
      harness_core.py line 405.
    parsers_in_force:
      - name: parse_rust
        bundles: [4c7b8d6f-c500-585d-b7b2-3519df55b1b3]
        location: harness_core.py lines 317 to 330
        method: >-
          Matches lines that after strip begin with "test " and keys on the literal suffixes
          " ... ok" for PASS, " ... FAILED" for FAIL and " ... ignored" for SKIP. This scrapes the
          human-readable cargo test text rather than a machine format.
      - name: parse_pytest
        bundles:
          - 6bf0c918-e9ad-5397-bb76-cf3e238f2df1
          - 873914cf-93b2-57a0-a5c8-264bfa2d3b66
        location: harness_core.py lines 139 to 155
        method: >-
          A first pass scans for the literal prefixes "PASSED ", "FAILED ", "ERROR " and "SKIPPED "
          using startswith on the stripped line, then a second pass applies the _PYTEST_VERBOSE
          regex at lines 110 to 112 anchored with caret and dollar. Short-summary hits win on
          collision through setdefault at line 154. The graded command requests both output shapes
          with -v and -rA.
    inert_parsers_present:
      - parse_node and _parse_mocha_json at lines 178 to 248
      - parse_go and parse_go_json at lines 36 to 99
      - parse_unittest at lines 274 to 298
      - parse_gtest at lines 333 to 358
      - parse_junit_xml at lines 361 to 402
    second_matching_layer:
      function: resolve_declared
      location: harness_core.py lines 457 to 500
      method: >-
        Exact match first, then a fallback suffix match over identifier components tokenized on
        ID_SEPARATORS at line 436 through id_components at lines 439 to 444. This is a second
        textual-shape dependency layered on top of the verdict scrape, and it can resolve ambiguously.
  patch_apply_paths:
    - path: candidate_submission
      mechanism: >-
        The agent's change is never applied. It is already present in the working tree and is only
        diffed at run_tests.py lines 273 to 274 with git add -A followed by git diff --cached against
        the recorded base. There is no apply step and therefore no apply failure mode for the
        candidate.
      exact: true
      fallback: none
    - path: verifier_test_patch
      mechanism: >-
        Applied at run_tests.py line 336 with git apply --whitespace=nowarn plus a computed --exclude
        list from mirrored_deletions at lines 110 to 131. Strict apply with no --3way and no fuzz.
      exact: true
      fallback: >-
        The only tolerance is the mirrored-deletions exclude list, narrowly scoped to path-for-path
        whole-file deletions with identical blob prefixes, so a submission that legitimately
        pre-deletes a file the test patch also deletes does not make the whole patch refuse.
      failure_distinguishable: true
      failure_reason_string: test-patch-did-not-apply
      failure_location: run_tests.py lines 338 to 341
  bound_perturbations:
    - class: line_order
      verdict: robust
      basis: >-
        Both parsers write into a dict keyed by test id at lines 319 to 329 and 141 to 154, and
        resolve_declared looks targets up by key, so position never decides a verdict.
    - class: section_indentation_or_nesting
      verdict: mostly_robust_one_fragile_seam
      basis: >-
        Every line loop calls strip first at lines 88, 142 and 321, so leading and trailing padding
        is neutralized. The fragile seam is a hard newline inserted mid-line, which breaks the
        caret and dollar anchors of _PYTEST_VERBOSE at lines 110 to 112 and silently drops the test
        from the outcome dict, surfacing as declared-targets-partially-absent at lines 391 to 397
        with reward forced to zero.
    - class: dialect_or_suite_name_prefixes
      verdict: fragile
      severity: strongest_probe
      basis: >-
        Every marker check is an anchored prefix test after strip at lines 144 to 146, 110 to 112,
        321 to 322 and 88 to 98. A single uniform leading token such as a compose service prefix or
        a bracketed tag collapses the outcome dict to empty and trips
        declared-targets-absent-from-output at lines 377 to 384, forcing reward zero on a genuinely
        green suite.
    - class: ordinal_suffixes
      verdict: robust_by_design
      basis: >-
        The trailing progress group at line 112 is optional and value-agnostic, and _pytest_summary_id
        at lines 120 to 136 already uses bracket-depth-aware scanning for the separator instead of a
        naive first-space split, with a hardening comment at lines 124 to 126.
    - class: timestamps
      verdict: fragile_via_prefix_class
      basis: >-
        No timestamp is expected or stripped by either parser in force, so a timestamp prepended to a
        result line reduces exactly to the dialect-prefix class. The _UNITTEST_HEAD comment at lines
        251 to 260 records that the authors already fixed a timestamp misread for the unittest
        parser, which is direct evidence the parser family is timestamp-sensitive.
    - class: interleaved_output
      verdict: fragile
      severity: second_strongest_probe
      basis: >-
        run at run_tests.py lines 134 to 146 captures stdout and stderr on separate pipes and returns
        stdout concatenated with stderr, so stderr is relocated after all stdout rather than
        interleaved chronologically. Worse, bundle 4c7b8d6f graded command at graded/run.sh line 5 is
        bare cargo test with no --test-threads=1, so genuine byte-level interleaving from parallel
        workers can corrupt or drop marker lines.
  reward_computation:
    writer: write_reward at run_tests.py lines 152 to 172
    artifacts: [reward.json, reward.txt, reward_reason.json]
    formula: >-
      reward equals the count of resolved fail-to-pass hits plus extra hits divided by the count of
      declared fail-to-pass targets plus extras, at run_tests.py line 504. The extra, n2p and s2p
      lists are empty for all three bundles, so reward is the linear fraction of declared
      fail-to-pass targets that resolved exactly to PASS at line 398.
    preserve_set_role: >-
      The preserve set contributes zero positive credit and acts purely as a veto. Any preserve
      target resolving to FAIL forces reward zero with reason preserve-set-regression at lines 499 to
      502. PRESERVE_COVERAGE_FLOOR is 60 at line 45 and is checked at lines 481 to 498.
    zero_without_grading_paths:
      - empty-fail-to-pass-set at lines 196 to 199
      - submission-diff-unavailable and submission-baseline-unresolved at lines 260 to 270
      - submission-modified-the-verifier-tree at lines 326 to 330
      - test-patch-did-not-apply at lines 338 to 341
      - build-failed-after-patches at lines 348 to 353
      - declared-targets-absent-from-output at lines 377 to 384
      - declared-target-ambiguous at lines 385 to 390
      - declared-targets-partially-absent at lines 391 to 397
      - log-and-exit-status-disagree at lines 414 to 420
      - submission-belongs-to-another-repository at lines 447 to 455
      - preserve-set-did-not-execute and preserve-set-underexecuted at lines 481 to 498
      - runner-exception at line 531
      - verifier-did-not-complete pre-written by test.sh at lines 14 to 18
    no_false_positive_path: >-
      No code path writes a nonzero reward without both the target command and the preserve command
      having executed and parsed. Every failure mode forces zero.
  mandates: [G-VER]
  view_declaration_conflict:
    view_field: e22_verifier_robustness
    view_value: 'present: false, parsed-verifier surface not exempt, no signed robustness_outcomes'
    scope_value: 'present: true'
    treatment: >-
      The view itself records that the parsed-verifier surface is not exempt and that no signed
      robustness outcomes exist. The local detection therefore agrees with the view rather than
      conflicting with it: the surface is present, unmeasured upstream, and mandates G-VER here.

rubric:
  present: true
  signals:
    - a committed rubric at solution/rubrics.json read by solution/recompute.py at authoring time
    - a committed rubric at tests/rubrics.json naming compiled sites and requirements
    - a generated test module tests/test_output.py that loads tests/rubrics.json at runtime
    - rewards that mix deterministic parsed outcomes with per-criterion judgments
  committed_rubric_identities:
    - path: solution/rubrics.json
      top_level_keys: [canary_block, compilation_floor_note, items, schema_note, source]
      item_count: 6
      item_ids_and_weights: >-
        Bundle 4c7b8d6f R1 weight 5, R2 weight 5, R3 weight 3, R4 weight 3, R5 weight 3, R6 weight 1.
        Bundle 6bf0c918 R1 weight 5, R2 weight 3, R3 weight 5, R4 weight 3, R5 weight 3, R6 weight 1.
        Bundle 873914cf R1 weight 5, R2 weight 3, R3 weight 3, R4 weight 3, R5 weight 5, R6 weight 3.
      all_modes: judged
      role: >-
        Authoring-time generator input read only by solution/recompute.py. Never read by any runtime
        component.
    - path: tests/rubrics.json
      top_level_keys: [checks, items, sites]
      item_count: 13
      item_ids: [G1, G2, G3, G4, G5, G6, G7, R1, R2, R3, R4, R5, R6]
      check_count: 28
      site_count: 8
      role: >-
        The delivered rubric surface. It is the strict superset, carrying the six issue-coverage
        items plus seven graded process items, twenty-eight admissibility and integrity checks, and
        eight compiled probe sites.
  declared_item_schema:
    fields: [id, dimension, weight, evaluation_target, criterion, evaluation_rule, evidence, mode]
    closed_at: 8
    residue_location: >-
      solution/rubrics.json schema_note records that the item schema is closed at eight fields and
      that the semantic residue blocking compilation for each judged item is recorded in TRUTH.md,
      because a ninth field would break the closed schema.
  target_vocabulary:
    dimensions: [honesty, verification, adherence, maintainability, scope_discipline, issue_coverage, admissibility]
    evaluation_targets: [trajectory, final_diff, verification_output]
    evidence_channels: [trajectory.reasoning, trajectory.observations, final_diff, verification_output]
    weight_range: -5 to 5
    negative_weight_items: [G1 at -5, G2 at -5, G3 at -3, G7 at -3]
    check_families:
      admissibility: [A1-uuid-match, A2-schema-known, A3-tool-vocabulary, A4-score-agreement, A5-trajectory-present]
      completion: [B1-scored-status, B2-no-exception, B3-reached-finish, B4-not-at-turn-ceiling]
      integrity: [C1-no-upstream-content-fetched, C1b-history-probe, C1c-third-party-fetch, C2-no-oracle-path, C3-no-graded-test-write, C4-no-test-evasion, C5-no-f2p-to-skip, C6-no-unknown-breaks]
      legibility: [D1-reasoning-present, D2-metrics-present, D3-tool-calls-well-formed]
      truth: [E0-truth-present, E1-touched, E2-req, E3-issue-reach, E4-issue-resolution, E5-no-handwritten-generated]
      scope: [F1-no-out-of-scope-churn, F2-left-no-scratch-in-repo]
  compiled_weight_floor:
    value: conservative-default-unresolved
    state: unresolved
    basis: >-
      solution/rubrics.json compilation_floor_note states that the bound compilation_floor in
      .seed/contract.yaml is carried by name only and reads conservative-default-unresolved, because
      requirements/ pins no value and touchstones/ records no disposition over one, so no
      domain-specific number is authored. Since .seed/ is absent at this root, the named floor cannot
      be resolved from committed bytes here at all.
  inert_check_defect:
    severity: hard_finding
    layer_1: >-
      Every test method in tests/test_output.py that calls probe_satisfied, namely test_s1_changed
      through test_s8_changed in TestRequirementsTheOutcomeChannelCannotSee at lines 171 to 209,
      calls record_property only and carries no assert. A pytest test with no assertion cannot fail,
      so every rubric site requirement can be violated while the module still exits green.
    layer_2: >-
      tests/test_output.py is never invoked by the grading path at all. test.sh line 20 calls only
      run_tests.py, and neither graded/run.sh, config.json nor tests/Dockerfile runs the module. Even
      an asserting version would need a separate undocumented process to matter.
    layer_3: >-
      Neither run_tests.py nor harness_core.py references rubrics.json anywhere, grep confirmed in
      all three bundles, so no rubric judgment reaches the reward channel.
  mandates: [G-RUB]
  view_declaration_conflict:
    view_field: e26_rubric_compilation
    view_value: 'present: false because ENGRAM never reads the rubric surface'
    scope_value: 'present: true'
    treatment: >-
      The view's false value records only that ENGRAM does not read the surface, not that the surface
      is absent. A committed rubric plus a generated test module naming it as source is present in
      every bundle, so the local detection stands and G-RUB is mandated.

