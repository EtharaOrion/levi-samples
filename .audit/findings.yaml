  reason: signed-pilot-pass-rate-aggregate-unprojected
  statement: 'No signed pilot pass-rate aggregate is projected for any resident bundle. Every calibration
    row the permitted projection channel carries is keyed to a non-resident instance and records signed_cohort_pass_rates
    as null, so the signed half of the ordering input does not exist for this corpus. The rewards committed
    beside the rollouts are unsigned producer-written numbers at one run per solver identity and are not
    an aggregate. No hardness source was consulted to fill this void: the ordering input is recorded as
    absent rather than reconstructed from a forbidden surface.'
  subject: project
  surface: calibration
