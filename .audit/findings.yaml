  instrument: G-CON-NEARDUP
  reason: review-band-unadjudicated
  statement: Step 8j opens a mandatory recorded semantic adjudication for a neighbour from the review
    threshold up to but excluding the near-duplicate threshold. No adjudication record exists for this
    pair, and a semantic adjudication may only lower a disposition and may never certify absence.
  subject: 6bf0c918-e9ad-5397-bb76-cf3e238f2df1,873914cf-93b2-57a0-a5c8-264bfa2d3b66
  surface: task_corpus
