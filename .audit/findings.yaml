- caps: HOLD
  gap_id: D-BUD-BLOCK-DECLARATION-CONFLICT
  instrument: G-BUD-APPLICABILITY
  reason: budget-block-determination-conflicts-with-approved-scope
  statement: The approved scope file declares G-BUD mandated, recording its basis as 'budget blocks present
    in every task.toml'. This instrument determines from the same committed bytes that no manifest declares
    budget_hours, budget_envelope or budget_margin, and that the keys the scope cites are container sizing
    and watchdog timeouts rather than a budget envelope with a margin. The exemption is taken and the
    three G-BUD instruments do not run. The disagreement with the approved declaration is held open here
    rather than resolved by this module in its own favour, because an instrument is not entitled to overwrite
    an approved scope declaration about itself.
  subject: project
  surface: budget_conformance
- caps: HOLD
