- caps: HOLD
  gap_id: D-BUD-BLOCK-DECLARATION-CONFLICT
  instrument: G-BUD-APPLICABILITY
  reason: budget-block-determination-conflicts-with-approved-scope
  statement: The approved scope file declares G-BUD mandated, recording its basis as 'budget blocks present
    in every task.toml'. This instrument determines from the same committed bytes that no manifest declares
    budget_hours, budget_envelope or budget_margin, and that the keys the scope cites are container sizing
    and watchdog timeouts rather than a budget envelope with a margin. The exemption is taken and the
    three G-BUD instruments do not run. The disagreement with the approved declaration is held open here
    rather than resolved by this module in its own favour, because an instrument is not entitled to overwrite
    an approved scope declaration about itself.
  subject: project
  surface: budget_conformance
- caps: HOLD
  gap_id: D-CAL-PILOT-AGGREGATE-UNPROJECTED
  instrument: G-CAL-MONOTONICITY
  reason: signed-pilot-pass-rate-aggregate-unprojected
  statement: 'No signed pilot pass-rate aggregate is projected for any resident bundle. Every calibration
    row the permitted projection channel carries is keyed to a non-resident instance and records signed_cohort_pass_rates
    as null, so the signed half of the ordering input does not exist for this corpus. The rewards committed
    beside the rollouts are unsigned producer-written numbers at one run per solver identity and are not
    an aggregate. No hardness source was consulted to fill this void: the ordering input is recorded as
    absent rather than reconstructed from a forbidden surface.'
  subject: project
  surface: calibration
- caps: HOLD
  gap_id: D-CAL-TIER-UNPROJECTED
  instrument: G-CAL-MONOTONICITY
  reason: tier-declaration-unprojected
  statement: No tier declaration reaches this instrument through the permitted projection channel (CRUCIBLE_VIEW
    checker_metadata e21_calibration declared_tier). The projection carries tier declarations only for
    instances that are not resident in this tree. The manifests do carry their own tier target, and it
    is withheld by name rather than read, because a frontier-defeat target is inside the containment boundary
    CRUCIBLE may not cross and a finding citing it would be out of scope.
  subject: project
  surface: calibration
- caps: HOLD
  gap_id: D-COMPILATION-FLOOR-UNRESOLVED
  instrument: G-RUB-COMPLETENESS
  reason: compiled-weight-floor-unresolved
  statement: The compiled_weight_floor the rubric surface must clear reads unresolved in the approved
    scope, because it is carried by name from a .seed/contract.yaml that does not exist at this root.
    The actual compiled weight share is recomputed and recorded below, but it cannot be compared against
    a floor, so compiled coverage adequacy stays unmeasured rather than passed.
  subject: project
  surface: rubric
- caps: HOLD
