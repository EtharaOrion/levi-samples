  finding_id: ATT-NO-EXTERNAL-TRUST-ROOT
  instrument: G-EXEC-ATTESTATION
  severity: high
  statement: The only signing identity enrolled in the resolved trust policy is 'engram-project-local@levi',
    carrying roles checkpoint_signer, pilot_signer and recorded as PROJECT-LOCAL and not an independent
    external party. A signature from it proves the bytes have not changed since the project signed them,
    which is integrity and not independence, so it could never satisfy the external-trust-root requirement
    of step 8p. CRUCIBLE_VIEW additionally records source_attestation_trust_root as root_number 6 with
    status ABSENT and identity null. Agreement from this signer never raises a disposition.
