  reason: corpus-publishes-digests-not-payloads
  statement: The pinned corpus root publishes each of its units as an identity, a payload digest, and
    a shingle count, and publishes no shingle set or payload text. Exact payload identity against that
    corpus is computable and was computed. The similarity score the bound threshold is defined against
