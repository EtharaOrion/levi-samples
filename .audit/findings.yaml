  instrument: G-CON-NEARDUP
  severity: high
  statement: The pinned corpus already carries units drawn from the same upstream repository as a resident
    bundle. The corpus publishes each unit as a payload digest and a shingle count rather than payload
    text, so a similarity score against those units is not computable from what the root supplies, and
    same-repository presence is therefore recorded as an unmeasurable neighbourhood rather than as a clean
    screen.
