schema: crucible.adversary.nonces/v1
contract_step: 8t
strip_requirement: >-
  Step 8t strips .audit/adversary/ from every projection by name so the nonces below never reach
  the author. A probe whose nonce the author can read is a probe the author can special-case, and
  a special-cased probe measures nothing.
derivation: >-
  Every probe nonce is sha256(seed + ':' + probe_name + ':' + bundle_uuid) truncated to 16 hex
  characters. The seed is fixed and recorded here rather than drawn from the clock or the system
  entropy pool, because a probe artifact that differs between two runs of this harness cannot be
  reconciled against a recorded row.
seed: crucible-adversary-8t-20260923
truncation_hex_chars: 16
