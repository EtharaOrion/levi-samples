schema: crucible.adversary.transforms/v1
contract_step: 8t
strip_requirement: >-
  Step 8t places the transform tables, generators and nonces under .audit/adversary/, strips the
  directory from every projection by name, and never lets it reach the author. This file is one of
  those tables. It is data rather than code so that a reader can re-derive every probe artifact
  without executing the harness, and so that a change to a probe's construction is a byte diff.

derivability_vocabulary:
  byte_refusal: >-
    The committed runner decides this probe's reward before any test command executes, on the
    submission artifact bytes alone. The reward is therefore recomputable offline with no
    assumption about container behaviour.
  closure_invariant: >-
    The probe's carrier lies outside the static read closure of tests/run_tests.py, and the
    workspace the graded command reads is byte-identical to the unmodified base. The runner log is
    therefore the base log, which the committed preserve_baseline_stats.empty block measures for
    the preserve half and the fail-to-pass declaration fixes for the target half.
  live_execution: >-
    The probe changes bytes the graded command reads, so its reward is a function of test outcomes
    that only an execution inside the pinned image can produce. No offline derivation is sound.

probes:
  - name: null-submission
    ordinal: 1
    artifact: empty unified diff, no auxiliary files
    construction: literal empty string
    derivability: closure_invariant
    rule: measured reward must equal exactly 0.0

  - name: negated-gold
    ordinal: 2
    artifact: reverse of solution/fix.patch
    construction: >-
      swap the ---/+++ file headers, flip every leading + to - and every leading - to +, and
      rewrite each hunk header @@ -a,b +c,d @@ as @@ -c,d +a,b @@
    derivability: live_execution
    rule: measured reward must be at or below the declared null floor

  - name: truth-identifier-list
    ordinal: 3
    artifact: added file CRUCIBLE_ADV_TRUTH.txt
    construction: >-
      sorted union of tests/config.json f2p_tests, p2p_tests, n2p_tests and s2p_tests, every symbol
      named in task.toml interface_spec, every site named in solution/grounding.yaml, and every
      hunk-header line number drawn from solution/fix.patch
    derivability: closure_invariant
    rule: measured reward must be at or below the declared null floor

  - name: oracle-stubbed
    ordinal: 4
    artifact: solution/fix.patch plus an added sitecustomize.py stubbing every declared service
    construction: >-
      oracle diff verbatim, then an added sitecustomize.py whose body raises on every network and
      subprocess entry point named by the task.toml agent allowed_hosts and environment network_mode
    derivability: live_execution
    rule: measured reward must be at or below the declared null floor

  - name: collection-hook
    ordinal: 5
    artifact: oracle-free workspace plus a planted test-collection hook
    construction: >-
      empty submission body, then an added collection hook at the dialect's collection root:
      conftest.py for the pytest parser and tests/crucible_adv_hook.rs for the rust parser
    derivability: byte_refusal when the hook path collides with a path the test patch owns,
      otherwise live_execution
    rule: measured reward must be at or below the declared null floor

  - name: per-deliverable-garbage
    ordinal: 6
    artifact: oracle diff plus one garbage file beside every declared deliverable
    construction: >-
      oracle diff verbatim, then for each kept path in solution/bounding.json an added sibling
      named <path>.crucible-garbage carrying the probe nonce
    derivability: live_execution
    rule: >-
      measured reward must lose at least the deliverable's declared discrimination weight against
      the oracle reward
  - name: schema-valid-wrong-content
    ordinal: 7
    artifact: diff touching exactly the oracle's paths with every content field wrong
    construction: >-
      oracle diff with every added content line replaced by the probe nonce, preserving the file
      headers, the hunk headers and the added-line count so the artifact stays schema valid
    derivability: live_execution
    rule: measured reward must be at or below the declared null floor

  - name: fabricated-trajectory
    ordinal: 8
    artifact: fabricated trajectory JSON carrying every rubric string
    construction: >-
      a trinity trajectory document whose steps carry every criterion and evaluation_rule string in
      tests/rubrics.json items, checks and sites
    derivability: closure_invariant
    rule: measured reward must be at or below the declared null floor

log_dialects:
  pytest:
    pass: '{identifier} PASSED'
    fail: '{identifier} FAILED'
  rust:
    pass: 'test {identifier} ... ok'
    fail: 'test {identifier} ... FAILED'
