preamble: >-
  Every optional capability beyond the day-one default is named here with a state of exactly default,
  declared or implemented. A declared capability is decorative: it is named but byte-level incomplete,
  it never raises a disposition, and it never substitutes for the default. An implemented claim
  missing required bytes, or a stronger opt-in silently falling back to the weaker default, caps at
  HOLD. The Phase 0.5 approved digest binds this block, so any flip re-triggers sign-off.

capabilities:
  - name: dynamic_revalidation_depth
    state: default
    seam: closed
    default_behavior: >-
      Findings are established from committed bytes and from instrument runs over those bytes. No
      finding is revalidated by executing an exploit inside a hardened sandbox, so no finding in this
      run depends on surviving a dynamic exploit.
    requirements_for_implemented:
      - a pinned sandbox image named by digest
      - an explicit network policy for that sandbox
      - the exact exploit each dependent finding must survive, named per finding
    why_not_declared: >-
      Declaring this capability without the pinned image, the network policy and the per-finding
      exploit would be decorative and would risk the appearance of a stronger validation than this
      run performs. The default is recorded honestly instead.
    disposition_effect: none

  - name: contamination
    state: default
    seam: closed
    axis_note: >-
      This capability sits beyond the mandatory G-CON benchmark-source floor rather than beside it.
      The floor screens named public evaluation sets and freeze dates, the near-duplicate index, and
      the shipped delivery closure. This capability screens a model training corpus. The axes are
      distinct, so no capability state disables, replaces or satisfies the floor, and the floor runs
      in this run regardless of this state.
    default_behavior: >-
      The mandatory G-CON floor runs. No independent containment re-run against an ENGRAM-bound
      training-corpus snapshot is performed.
    requirements_for_implemented:
      - an ENGRAM-bound corpus snapshot digest resolvable for the resident units
      - a bound threshold for that snapshot
      - an independent re-run over committed bytes mirroring the leak-gate re-run
    why_not_declared: >-
      The bound corpus snapshot digest 3f8669dadcb03fb8790978d11f4b7e38bb88cda48eca62256a729f5518b7ff31
      exists and names 1391 units across four sources, and the threshold exists at 0.3 with a
      calibrated floor at 0.393291. However the calibration and the index both resolve per-unit
      entries only for three foreign task_uuid_v5 values, and none of the three resident bundles
      appears in either. A containment re-run keyed to the resident units therefore has no bound
      standing to re-run against. Declaring the capability would name machinery that cannot execute
      over the audited units, which is precisely the decorative claim the contract warns against.
    re_run_input_restriction: >-
      If ever implemented, the re-run consumes only CRUCIBLE_VIEW, committed bytes and the bound
      corpus snapshot digest. It never consumes FORGE self-attestation. A result at or above threshold
      would be a retained domain-integrity finding that may only lower disposition.
    disposition_effect: none

  - name: autonomous_gates
    state: default
    seam: closed
    default_behavior: >-
      The Phase 0.5 scope sign-off gate is discharged by a human approver writing the SHA-256 of
      .audit/scope.yaml into .audit/scope.approved. No out-of-band gatekeeper discharges it.
    requirements_for_implemented:
      - an objective byte-level definition naming the gatekeeper identity
      - that gatekeeper holding the gate_approver role in the external trust-root policy
      - the gatekeeper work-order digest
      - a model-lineage diversity requirement
      - a calibration policy
      - the first flip to implemented itself human-signed
    why_not_declared: >-
      No out-of-band gatekeeper is defined for this project, and an autonomy grant written by the
      autonomous party is a self-attestation loop the contract forbids. This run therefore keeps the
      gate human.
    approver_of_record:
      identity: Ankit Porwal
      role: gate_approver
      source: >-
        The parent ENGRAM trust root at ../.memory/crucible_view.yaml names Ankit Porwal with the
        gate_approver role, independence recorded as human project lead external to the agent runtime,
        evidence a SIGNOFF.md signature block dated 2026-09-07 with evidence_sha256
        56bf5c155a275c49f9c5a5c1959009c4257e8bc3ad7563d4d93206b470398dfd, scope explicitly
        discharging the Phase 0.5 scope digest gate for this project.
      consequence: >-
        Phase 0.5 approval by this principal at operator direction is a human approval under the named
        trust-root role, not an autonomous-gate discharge. The capability therefore stays at default
        and no flip occurs.
    disposition_effect: none

floor_note: >-
  No capability in this file is declared or implemented. Every optional axis rests at its day-one
  default, so nothing in this block raises a disposition, nothing substitutes for a mandatory floor,
  and no stronger opt-in silently falls back to a weaker default.
