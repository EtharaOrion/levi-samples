ed to be cleared.\n\n---\n\n## A. Scope corrections (operator edits `.audit/scope.yaml`, then re-signs `scope.approved`)\n\n### A1. F-REWARD-POPULATION-DIVERGENCE, D-REWARD-SCOPE-POPULATION-DIVERGENCE\n- Evidence: `scope.yaml trajectories.per_bundle[].recorded_reward` lists 3 values (one per bundle);\n  the tree commits 6 rollouts. Measured `verifier/reward.txt`:\n  4c7b8d6f opus 0.0, glm 0.0; 6bf0c918 opus 0.5, glm 0.0; 873914cf opus 0.5, glm 0.875.\n- Action: add under `trajectories:` →\n  `rewards: [0.0, 0.0, 0.5, 0.0, 0.5, 0.875]` (read by `reward.py::_scope_declared_rewards`).\n  This corrects the declaration to the measured population. It does not change any reward.\n\n### A2. D-BUD-BLOCK-DECLARATION-CONFLICT\n- Evidence: `scope.yaml required_instruments` lists G-BUD with basis \"budget blocks present in every\n  task.toml\". No task.toml declares `budget_hours`, `budget_envelope` or `budget_margin`; the cited\n  keys are container sizing and watchdog timeouts. `attestation.py::run_budget_applicability`\n  already determines every bundle exempt. Contract step 8s: a bundle with no budget block and no\n  standing `budget:required` priority is exempt.\n- Action: remove the G-BUD row from `required_instruments` (keep a comment recording the 8s\n  exemption). The conflict gap then no longer fires because the scope and instrument agree.\n\n### A3. D-VER-TRIALS-UNPROJECTED-FLAKINESS / -STABILITY, D-COMPILATION-FLOOR-UNRESOLVED\n- These need operator-chosen values; the harness correctly refuses to invent them.\n- Action: operator binds `verifier_robustness.flakiness_trials`, `verifier_robustness.stability_trials`\n  and `compiled_weight_floor.value` in scope.yaml. NOTE: `verifier.py::_trials_gap` and\n  `rubric.py::_run_completeness` currently append these gaps unconditionally; CRUCIBLE must make\n  them conditional on the bound value being absent, and run the probes at the bound count.\n\n---\n\n## B. False positives (request CRUCIBLE adjudication and instrument correction, recorded in the feedback chain)\n\n### B1. F-CON-STRIP-FIX-SIGNATURE-6bf0c918\n- Evidence: the finding text itself states \"the approved scope declares a names-only reference\n  interface specification for this bundle, so restating a signature is within the approved design\".\n- Action: resolve as within-approved-design; do not cap.\n\n### B2. REF-NAMES-ONLY-INTERFACE\n- Concern stated: a stub carrying the name would satisfy the checker.\n- Evidence against, measured live in pinned images (`.audit/adversary/live/*`):\n  schema-valid-wrong-content = 0.0, negated-gold = 0.0, empty submission = 0.0 on every bundle;\n  per-deliverable corruption re-measured after the 096941e transform correction.\n  Discrimination is established by execution, not by the interface spec.\n- Action: resolve REF-NAMES-ONLY-INTERFACE as refuted by measured probe discrimination.\n\n### B4. Remediation line \"One genuine contamination survives any re-screen: 873914cf\" (report.md:280)\n- Evidence: `.memory/roots/freeze_table.json` per_set_cutoffs bind only units whose repository is\n  in a listed set (SWE-bench, SWE-bench_Verified, SWE-bench_Multilingual, SWE-Gym, SWE-rebench,\n  Multi-SWE-bench). The same table determines a reflex-dev/reflex unit `not_applicable` (\"base\n  repository is absent from every listed evaluation set\"). 873914cf is reflex-dev/reflex.\n  The 2023-02-21 date is `upstream_change_committed_at`, a commit timestamp that step 8i refuses\n  as the task-generating event. The only formal finding is D-PROV-FREEZE-TABLE-UNRESOLVED (HOLD,\n  \"undecidable\").\n- Action: withdraw the \"genuine contamination\" statement; the freeze question stays an open HOLD\n  until ENGRAM re-screens the resident bundles.\n\n### B3. Stale remediation line rendered as ⛔\n- \"All adversary probes and the empty-submission replay are now measured locally...\" is a\n  completion note, not a blocker. Action: render it as resolved/informational, not ⛔.\n\n---\n\n## C. Rollout 6bf0c918 / zai__glm-5.3 / run_1 — reclassify the zero as a graded FAIL\n\nFindings: FID-TRACE-SUPPRESSING, FID-TRACE-STATUS-DISAGREEMENT, F-DEL-LAYOUT-DECLARED-ARTIFACT-ABSENT\n(summary.json), D-VER-LOG-UNPROJECTED, D-VER-SCORE-UNPROJECTED, D-REWARD-COMPONENTS-ABSENT.\n\n- Evidence: `final.diff` touches 56 files, none under tests; `process.json` C3-no-graded-test-write\n  pass (\"wrote []\"), C4 pass, C5 pass. `target-stdout.md:193-196`: ERROR collecting\n  tests/utils/test_format.py — pydantic ValidationError for EventChain.event_actions, caused by the\n  agent's source change. Numerous other targets FAILED (test_event.py, test_component.py,\n  test_script.py). `reward_reason.json`: declared-targets-partially-absent, 14/18 matched.\n- The zero is a correct failure: the 4 \"unseen\" targets are unseen because the agent's code broke\n  their module at import. It is not a harness non-execution and does not make the task look harder.\n- Action:\n  1. Grader fix in `tests/harness_core.py` (all bundles, byte-identical): a target whose test module\n     appears in an \"ERROR collecting <path>\" block is recorded as FAIL, not absent; reason becomes\n     `graded`. Re-grade all 6 rollouts with the fixed grader (expected reward changes: none).\n  2. Re-emit summary.json and preserve-stdout.md for this rollout from the re-grade.\n- If the operator's pipeline has a separate test-file-modification gate that zeroed this run, its\n  record must be committed beside the rollout; nothing in the current bytes shows it fired.\n\n---\n\n## D. Standing — acknowledged, not requested to be cleared by argument\n\n| Finding(s) | Why it stands | What closes it |\n|---|---|---|\n| F-REWARD-SCORER-OUTSIDE-CLOSURE ×6 (BLOCK) | Judge rubric enters `score_eval` (weight 2α≈0.053). Feedback 0010 ruled a policy.yaml advisory flag insufficient. | Operator decision: re-emit process.json with rubric removed from the composed score, OR 11-trial randomized judging. |\n| FID-POPULATION-UNPROVABLE (BLOCK) | No precommitted